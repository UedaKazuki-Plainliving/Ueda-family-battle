<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大乱闘　ウエダファミリー</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; overflow: hidden; }
  #wrap { position: relative; width: 100vw; }
  canvas { display: block; width: 100vw; height: auto; touch-action: none; -webkit-user-select: none; user-select: none; }
  /* タッチ端末でcanvas+操作UIがビューポートに収まるよう高さから逆算してwidthを制限 */
  @media (pointer: coarse) {
    canvas { width: min(100vw, calc((100svh - 165px) * 800 / 450)); }
  }
  #nav-ctrls {
    display: flex; justify-content: center; align-items: center; gap: 24px;
    padding: 10px 0; background: #111; width: 100%;
  }
  #fight-ctrls {
    display: none;
    position: relative; width: 100%; background: #111;
    padding: 8px 10px; user-select: none;
  }
  .ctrl-row { display: flex; justify-content: space-between; align-items: center; }
  .dpad { position: relative; width: 168px; height: 126px; }
  .dpad-btn {
    position: absolute; background: rgba(255,255,255,0.13); border: 2px solid rgba(255,255,255,0.25);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff; touch-action: none;
  }
  .dpad-btn:active, .dpad-btn.active { background: rgba(255,255,255,0.35); }
  #btn-left    { left: 0;    top: 42px;  width: 42px; height: 42px; }
  #btn-right   { left: 84px; top: 42px;  width: 42px; height: 42px; }
  #btn-up      { left: 42px; top: 0;     width: 42px; height: 42px; }
  #btn-down    { left: 42px; top: 84px;  width: 42px; height: 42px; }
  #btn-upleft  { left: 0;    top: 0;     width: 38px; height: 38px; font-size: 15px; }
  #btn-upright { left: 88px; top: 0;     width: 38px; height: 38px; font-size: 15px; }
  .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .abtn {
    width: 58px; height: 58px; border-radius: 50%;
    background: rgba(255,255,255,0.13); border: 2px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 11px; font-weight: bold; text-align: center;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; flex-direction: column; line-height: 1.1;
  }
  .abtn:active, .abtn.active { background: rgba(255,255,255,0.4); }
  #btn-punch { border-color: #ff9900; color: #ff9900; }
  #btn-kick  { border-color: #00ccee; color: #00ccee; }
  #btn-block { border-color: #aaa; color: #aaa; }
  #btn-special { border-color: #ffdd00; color: #ffdd00; font-size: 10px; }
  .nbtn {
    padding: 10px 22px; border-radius: 8px; background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.3); color: #fff; font-size: 18px;
    touch-action: none;
  }
  .nbtn:active { background: rgba(255,255,255,0.35); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="450"></canvas>
  <div id="nav-ctrls">
    <button class="nbtn" id="nav-left">◀</button>
    <button class="nbtn" id="nav-ok">決定</button>
    <button class="nbtn" id="nav-right">▶</button>
  </div>
  <div id="fight-ctrls">
    <div class="ctrl-row">
      <div class="dpad">
        <div class="dpad-btn" id="btn-upleft">↖</div>
        <div class="dpad-btn" id="btn-up">▲</div>
        <div class="dpad-btn" id="btn-upright">↗</div>
        <div class="dpad-btn" id="btn-left">◀</div>
        <div class="dpad-btn" id="btn-right">▶</div>
        <div class="dpad-btn" id="btn-down">▼</div>
      </div>
      <div class="action-btns">
        <div class="abtn" id="btn-punch">👊<br>パンチ</div>
        <div class="abtn" id="btn-kick">🦵<br>キック</div>
        <div class="abtn" id="btn-block">🛡<br>ガード</div>
        <div class="abtn" id="btn-special">⚡<br>必殺技</div>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 450, GROUND = 340;
const EXIT_BTN = {x:5, y:5, w:52, h:24};
let CANVAS_H = H; // 2Pタッチ時は600に拡張

function setup2PTouchCanvas() {
  canvas.height = 600; CANVAS_H = 600;
  canvas.style.cssText = 'display:block;height:100dvh;width:auto;max-width:100vw;touch-action:none;-webkit-user-select:none;user-select:none;';
}
function resetCanvas() {
  canvas.height = H; CANVAS_H = H;
  canvas.style.cssText = 'display:block;height:auto;touch-action:none;-webkit-user-select:none;user-select:none;';
}

/* ==================================================================
   GFX — 描画強化レイヤ
   ゲームロジック・当たり判定・通信には一切関与しない純粋な描画層。
   canvas を生成できない環境（単体テストの vm サンドボックス）では
   すべて自動的に従来描画へフォールバックする。
   ================================================================== */
const GFX = (function () {
  function mk(w, h) {
    try {
      const c = document.createElement('canvas');
      if (!c || typeof c.getContext !== 'function') return null;
      c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
      const g = c.getContext('2d');
      return (g && typeof g.drawImage === 'function') ? { c, g } : null;
    } catch (e) { return null; }
  }
  const probe = mk(8, 8);
  const OK = !!probe;
  let FILTER = false;
  if (OK) {
    try { probe.g.filter = 'blur(2px)'; FILTER = (probe.g.filter === 'blur(2px)'); probe.g.filter = 'none'; }
    catch (e) { FILTER = false; }
  }
  const HEAVY = OK && FILTER && !IS_TOUCH;
  const _dprRaw = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
  const DPR = OK ? Math.max(1, Math.min(IS_TOUCH ? 2 : 3, _dprRaw)) : 1;

  const ghostPool = [], ghosts = [];
  let stageKey = '';

  /* ---- キャラクター合成用バッファ ----
     バッファは論理サイズ×BS の実ピクセルで持ち、内部変換に BS を掛ける。
     こうしないと等倍で描いた絵を高DPIキャンバスへ拡大することになり、
     せっかくの高解像度が活きない。 */
  let BS = OK ? (IS_TOUCH ? 1 : Math.max(1, Math.min(2, Math.round(DPR)))) : 1;
  const CW = 248, CH = 280, COX = 120, COY = 250;
  const mkB = (w, h) => mk(Math.round(w * BS), Math.round(h * BS));
  let bodyB = OK ? mkB(CW, CH) : null;   // 素体シルエット
  let compB = OK ? mkB(CW, CH) : null;   // 合成結果
  let tmpB  = OK ? mkB(CW, CH) : null;   // 輪郭・リム作業用
  const setT  = (g) => g.setTransform(BS, 0, 0, BS, 0, 0);
  // 非力な端末と判定されたらバッファ解像度も等倍へ戻す
  function rebuildBuffers(scale) {
    if (!OK || BS === scale) return;
    BS = scale;
    const nb = mkB(CW, CH), nc = mkB(CW, CH), nt = mkB(CW, CH);
    if (nb && nc && nt) { bodyB = nb; compB = nc; tmpB = nt; ghostPool.length = 0; ghosts.length = 0; stageKey = ''; }
  }

  /* ---- ポストプロセス用バッファ ---- */
  let bloomA = null, bloomB = null;
  let postW = 0, postH = 0;

  /* ---- カメラ（演出専用。座標系や判定には影響しない） ---- */
  let shakeAmp = 0, shakeT = 0, zoomPunch = 0, camActive = false;

  /* 品質ティア
       3: 輪郭+陰影+リム / 床反射 / 残像 / ブルーム
       2: 輪郭+陰影+リム / ブルーム
       1: 輪郭+陰影+リム のみ
       0: 効果なし（元の描画にフォールバック）
     実測フレームレートが足りなければ自動的に下げる。 */
  let tier = OK ? (IS_TOUCH ? 2 : 3) : 0;
  let fpsN = 0, fpsT0 = 0, downT = 0;

  const api = {
    ok: OK, heavy: HEAVY, filter: FILTER, dpr: DPR,
    target: null,        // _shape() の描画先。通常は本体 ctx
    bodyCY: -60,         // 胴体中心の y（_shape が毎回更新する）
    get tier() { return tier; },
    setTier(v) { tier = Math.max(0, Math.min(3, v | 0)); },
  };

  // 毎フレーム呼ばれ、重ければティアを下げる
  let firstCheck = true;
  api.tick = function (ts) {
    if (!OK) return;
    if (!fpsT0) { fpsT0 = ts; fpsN = 0; return; }
    fpsN++;
    const dt = ts - fpsT0;
    // 初回だけ短く測り、非力な環境では素早く品質を落とす
    if (dt < (firstCheck ? 600 : 1500)) return;
    const fps = fpsN * 1000 / dt;
    fpsT0 = ts; fpsN = 0; firstCheck = false;
    if (fps < 48 && tier > 0 && downT <= 0) {
      tier -= (fps < 20 ? 2 : 1);              // 極端に遅ければ一気に落とす
      if (tier < 0) tier = 0;
      downT = 2;
      if (tier <= 1) rebuildBuffers(1);        // 高解像度バッファもやめる
    }
    else if (downT > 0) downT--;
  };

  /* ---------- 高DPIリサイズ ---------- */
  api.resize = function (logicalH) {
    if (!OK) return;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(logicalH * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    if (ctx.imageSmoothingQuality !== undefined) ctx.imageSmoothingQuality = 'high';
    postW = 0;      // ポストバッファを作り直させる
    overlay = null;
    stageKey = '';  // ステージキャッシュも作り直す
  };

  /* ---------- ステージの静的レイヤをキャッシュ ---------- */
  let stageBuf = null;
  api.stage = function (key, drawFn) {
    if (!OK) { drawFn(ctx); return; }
    const k = key + '|' + W + 'x' + CANVAS_H;
    if (stageKey !== k || !stageBuf) {
      const sw = Math.round(W * BS), sh2 = Math.round(CANVAS_H * BS);
      if (!stageBuf || stageBuf.c.width !== sw || stageBuf.c.height !== sh2) stageBuf = mk(sw, sh2);
      if (!stageBuf) { drawFn(ctx); return; }
      setT(stageBuf.g);
      stageBuf.g.globalCompositeOperation = 'source-over';
      stageBuf.g.globalAlpha = 1;
      stageBuf.g.clearRect(0, 0, W, CANVAS_H);
      drawFn(stageBuf.g);
      stageKey = k;
    }
    ctx.drawImage(stageBuf.c, 0, 0, W, CANVAS_H);
  };
  api.invalidateStage = function () { stageKey = ''; };

  /* ---------- カメラ演出 ---------- */
  api.shake = function (amp, frames) {
    shakeAmp = Math.max(shakeAmp, amp);
    shakeT   = Math.max(shakeT, frames);
  };
  api.punch = function (v) { zoomPunch = Math.max(zoomPunch, v); };
  api.camBegin = function () {
    if (!OK) return;
    let sx = 0, sy = 0;
    if (shakeT > 0) {
      const k = shakeAmp * Math.min(1, shakeT / 8);
      sx = (Math.random() * 2 - 1) * k;
      sy = (Math.random() * 2 - 1) * k * 0.75;
      shakeT--; if (shakeT <= 0) shakeAmp = 0;
    }
    const z = 1.02 + zoomPunch;
    zoomPunch *= 0.86; if (zoomPunch < 0.001) zoomPunch = 0;
    ctx.save();
    ctx.translate(W / 2 + sx, CANVAS_H / 2 + sy);
    ctx.scale(z, z);
    ctx.translate(-W / 2, -CANVAS_H / 2);
    camActive = true;
  };
  api.camEnd = function () { if (OK && camActive) { ctx.restore(); camActive = false; } };

  /* ---------- 素体の作り込み（骨格・肉付け） ----------
     元コードの手足は「太さ一定の直線ストローク（丸キャップ）」だった。
     ここでは描画コンテキストを包んで、そうしたストロークだけを
     付け根が太く先が細い立体的な四肢へ差し替える。
     _shape() 側 500 行は一切書き換えない。 */
  const LIGHT = { x: -0.50, y: -0.86 };      // 左上からの光

  function taper(g, x0, y0, x1, y1, w0, w1) {
    const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    g.beginPath();
    g.moveTo(x0 + nx * w0, y0 + ny * w0);
    g.lineTo(x1 + nx * w1, y1 + ny * w1);
    g.lineTo(x1 - nx * w1, y1 - ny * w1);
    g.lineTo(x0 - nx * w0, y0 - ny * w0);
    g.closePath(); g.fill();
    g.beginPath(); g.arc(x0, y0, w0, 0, 6.2832); g.fill();
    g.beginPath(); g.arc(x1, y1, w1, 0, 6.2832); g.fill();
  }

  function drawLimb(g, x0, y0, x1, y1, w) {
    const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    // 胴体の中心に近い端が付け根、遠い端が手先・足先
    const cy = api.bodyCY;
    const d0 = x0 * x0 + (y0 - cy) * (y0 - cy);
    const d1 = x1 * x1 + (y1 - cy) * (y1 - cy);
    let ax = x0, ay = y0, bx = x1, by = y1;
    if (d0 > d1) { ax = x1; ay = y1; bx = x0; by = y0; }
    const w0 = w * 0.62, w1 = w * (len > 16 ? 0.52 : 0.44);
    const keep = g.fillStyle;
    g.fillStyle = g.strokeStyle;
    taper(g, ax, ay, bx, by, w0, w1);
    if (tier >= 2) {
      const side = (nx * LIGHT.x + ny * LIGHT.y) >= 0 ? 1 : -1;
      g.fillStyle = 'rgba(0,0,0,0.20)';       // 暗い側
      taper(g, ax - nx * side * w0 * 0.36, ay - ny * side * w0 * 0.36,
               bx - nx * side * w1 * 0.36, by - ny * side * w1 * 0.36,
               w0 * 0.56, w1 * 0.56);
      g.fillStyle = 'rgba(255,255,255,0.20)'; // 明るい側
      taper(g, ax + nx * side * w0 * 0.44, ay + ny * side * w0 * 0.44,
               bx + nx * side * w1 * 0.44, by + ny * side * w1 * 0.44,
               w0 * 0.28, w1 * 0.28);
    }
    g.fillStyle = keep;
  }

  // 胴体（角の丸い樽型 + 陰影）。外形の幅・高さは元の矩形と揃える
  api.torso = function (g, bw, top, h) {
    const sw = bw * 0.50, wl = bw * 0.44, r = Math.min(bw * 0.26, h * 0.30);
    g.beginPath();
    g.moveTo(-sw + r, top);
    g.lineTo(sw - r, top);
    g.quadraticCurveTo(sw, top, sw, top + r);
    g.lineTo(wl, top + h - r * 0.55);
    g.quadraticCurveTo(wl, top + h, wl - r * 0.55, top + h);
    g.lineTo(-wl + r * 0.55, top + h);
    g.quadraticCurveTo(-wl, top + h, -wl, top + h - r * 0.55);
    g.lineTo(-sw, top + r);
    g.quadraticCurveTo(-sw, top, -sw + r, top);
    g.closePath();
    g.fill();
    const keep = g.fillStyle;
    const grd = g.createLinearGradient(-sw, top, sw * 0.7, top + h);
    grd.addColorStop(0.00, 'rgba(255,255,255,0.22)');
    grd.addColorStop(0.42, 'rgba(255,255,255,0.00)');
    grd.addColorStop(1.00, 'rgba(0,0,0,0.24)');
    g.fillStyle = grd; g.fill();
    g.fillStyle = keep;
  };

  // 頭の陰影（塗ったあとに同じ円へ重ねる）
  api.headShade = function (g, cx, cy, r) {
    const keep = g.fillStyle;
    const hg = g.createRadialGradient(cx - r * 0.34, cy - r * 0.40, r * 0.08, cx, cy, r);
    hg.addColorStop(0.00, 'rgba(255,255,255,0.26)');
    hg.addColorStop(0.52, 'rgba(255,255,255,0.00)');
    hg.addColorStop(1.00, 'rgba(0,0,0,0.22)');
    g.fillStyle = hg; g.fill();
    g.fillStyle = keep;
  };

  /* 直線ストロークだけを四肢に差し替えるラッパ */
  function limbCtx(g) {
    if (g.__limbProxy) return g.__limbProxy;
    let pts = [], simple = true;
    const curved = ['arc', 'arcTo', 'ellipse', 'rect', 'bezierCurveTo', 'quadraticCurveTo', 'closePath'];
    const proxy = new Proxy(g, {
      get(t, prop) {
        if (prop === 'beginPath') return () => { pts.length = 0; simple = true; t.beginPath(); };
        if (prop === 'moveTo')    return (x, y) => { pts.push(x, y); t.moveTo(x, y); };
        if (prop === 'lineTo')    return (x, y) => { pts.push(x, y); t.lineTo(x, y); };
        if (curved.indexOf(prop) >= 0) return function () { simple = false; return t[prop].apply(t, arguments); };
        if (prop === 'stroke') return () => {
          if (simple && pts.length === 4 && t.lineCap === 'round' && t.lineWidth >= 3.5 &&
              Math.hypot(pts[2] - pts[0], pts[3] - pts[1]) >= 8) {
            drawLimb(t, pts[0], pts[1], pts[2], pts[3], t.lineWidth);
          } else t.stroke();
          pts.length = 0;
        };
        const v = t[prop];
        return (typeof v === 'function') ? v.bind(t) : v;
      },
      set(t, prop, val) { t[prop] = val; return true; }
    });
    try { Object.defineProperty(g, '__limbProxy', { value: proxy, enumerable: false }); } catch (e) {}
    return proxy;
  }

  /* ---------- キャラクター描画（シェーディング合成） ----------
     shapeFn は GFX.target に対して描画する。
     bodyB に素体を描いてから、輪郭・セルシェード・リムライトを合成する。 */
  // 素体を描いて compB に陰影付きの合成結果を作る
  function buildShaded(setup, shapeFn) {
    const bg = bodyB.g, cg = compB.g, tg = tmpB.g;

    // 1) 素体を bodyB に描く
    setT(bg);
    bg.clearRect(0, 0, CW, CH);
    bg.save();
    bg.translate(COX, COY);
    setup(bg);
    const prev = api.target; api.target = (tier >= 1 ? limbCtx(bg) : bg);
    try { shapeFn(); } catch (e) { /* 描画失敗時も進行を止めない */ }
    api.target = prev;
    bg.restore();

    // 2) セルシェード（上から光・下に影）を素体に焼き込む
    bg.save();
    bg.globalCompositeOperation = 'source-atop';
    const lg = bg.createLinearGradient(0, COY - 230, 0, COY + 10);
    lg.addColorStop(0.00, 'rgba(255,246,225,0.20)');
    lg.addColorStop(0.34, 'rgba(255,240,210,0.05)');
    lg.addColorStop(0.62, 'rgba(0,0,0,0)');
    lg.addColorStop(1.00, 'rgba(6,4,16,0.40)');
    bg.fillStyle = lg; bg.fillRect(0, 0, CW, CH);
    bg.restore();

    // 3) 合成: 輪郭 → 素体 → リムライト
    setT(cg);
    cg.clearRect(0, 0, CW, CH);

    // 3a) 輪郭（4方向オフセットの暗色シルエット）
    setT(tg);
    tg.clearRect(0, 0, CW, CH);
    tg.globalCompositeOperation = 'source-over';
    tg.drawImage(bodyB.c, 0, 0, CW, CH);
    tg.globalCompositeOperation = 'source-in';
    tg.fillStyle = 'rgba(10,8,22,0.92)';
    tg.fillRect(0, 0, CW, CH);
    tg.globalCompositeOperation = 'source-over';
    const r = 2.2;
    cg.drawImage(tmpB.c, -r, -r, CW, CH); cg.drawImage(tmpB.c, r, -r, CW, CH);
    cg.drawImage(tmpB.c, -r, r, CW, CH);  cg.drawImage(tmpB.c, r, r, CW, CH);

    // 3b) 素体
    cg.drawImage(bodyB.c, 0, 0, CW, CH);

    // 3c) リムライト（左上のエッジだけ明るく）
    setT(tg);
    tg.clearRect(0, 0, CW, CH);
    tg.globalCompositeOperation = 'source-over';
    tg.drawImage(bodyB.c, 0, 0, CW, CH);
    tg.globalCompositeOperation = 'destination-out';
    tg.drawImage(bodyB.c, 2.6, 2.4, CW, CH);
    tg.globalCompositeOperation = 'source-in';
    tg.fillStyle = 'rgba(255,238,196,0.62)';
    tg.fillRect(0, 0, CW, CH);
    tg.globalCompositeOperation = 'source-over';
    cg.save();
    cg.globalCompositeOperation = 'lighter';
    cg.globalAlpha = 0.75;
    cg.drawImage(tmpB.c, 0, 0, CW, CH);
    cg.restore();

  }

  /* 陰影付きの描画。setup(g) はバッファ原点からの変換を与える */
  api.shaded = function (x, y, groundY, scale, setup, shapeFn, opt) {
    if (!OK || tier === 0) {
      ctx.save(); ctx.translate(x, y); setup(ctx);
      const prev = api.target; api.target = ctx;
      try { shapeFn(); } catch (e) {}
      api.target = prev; ctx.restore(); return;
    }
    opt = opt || {};
    buildShaded(setup, shapeFn);
    const dx = x - COX, dy = y - COY;

    // 4) 接地影（床面に落ちる。高いほど薄く大きくなる）
    const air = Math.max(0, groundY - y);            // 床からの高さ
    const hf  = 1 / (1 + air / 120);                 // 高度による減衰
    const gy  = groundY + 2;
    const rad = (34 * scale + 8) * (1 + air / 300);
    ctx.save();
    const sh = ctx.createRadialGradient(x, gy, 1, x, gy, rad);
    sh.addColorStop(0, `rgba(0,0,0,${0.42 * hf})`);
    sh.addColorStop(0.6, `rgba(0,0,0,${0.16 * hf})`);
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sh;
    ctx.beginPath(); ctx.ellipse(x, gy, rad, (9 * scale + 3) * (1 + air / 420), 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // 5) 床への映り込み（足元から離れるほど減衰）
    if (tier >= 3 && opt.reflect !== false && air < 8 && selectedStage === 0) {
      const tg2 = tmpB.g;
      setT(tg2);
      tg2.globalCompositeOperation = 'source-over';
      tg2.clearRect(0, 0, CW, CH);
      tg2.drawImage(compB.c, 0, 0, CW, CH);
      tg2.globalCompositeOperation = 'destination-out';
      const fade = tg2.createLinearGradient(0, COY - 200, 0, COY + 6);
      fade.addColorStop(0, 'rgba(0,0,0,0.98)');
      fade.addColorStop(0.55, 'rgba(0,0,0,0.72)');
      fade.addColorStop(1, 'rgba(0,0,0,0.30)');
      tg2.fillStyle = fade; tg2.fillRect(0, 0, CW, CH);
      tg2.globalCompositeOperation = 'source-over';
      ctx.save();
      ctx.globalAlpha = 0.24;
      ctx.translate(0, groundY * 2 + 3);
      ctx.scale(1, -1);
      ctx.drawImage(tmpB.c, dx, dy, CW, CH);
      ctx.restore();
    }

    // 6) 本体
    ctx.drawImage(compB.c, dx, dy, CW, CH);
  };

  /* ファイター本体（通常の _shape 経路） */
  api.fighter = function (f, shapeFn, scale, flip) {
    api.shaded(f.x, f.y, GROUND, scale, function (g) {
      if (flip) g.scale(-1, 1);
      g.scale(scale, scale);
    }, shapeFn);
  };

  /* ---------- 残像（ダッシュ・必殺の演出） ---------- */
  const GHOST_N = 6;
  let ghostHead = 0;
  api.ghost = function (f, color) {
    if (!OK || tier < 3) return;
    if (ghostPool.length < GHOST_N) {
      const nb = mkB(CW, CH); if (!nb) return; ghostPool.push(nb);
    }
    const b = ghostPool[ghostHead % ghostPool.length]; ghostHead++;
    setT(b.g);
    b.g.globalCompositeOperation = 'source-over';
    b.g.clearRect(0, 0, CW, CH);
    b.g.drawImage(compB.c, 0, 0, CW, CH);
    b.g.globalCompositeOperation = 'source-in';
    b.g.fillStyle = color || '#8fd4ff';
    b.g.fillRect(0, 0, CW, CH);
    b.g.globalCompositeOperation = 'source-over';
    // 同じバッファを指す古い残像は破棄する
    for (let i = ghosts.length - 1; i >= 0; i--) if (ghosts[i].img === b.c) ghosts.splice(i, 1);
    ghosts.push({ img: b.c, x: f.x, y: f.y, t: 9 });
    if (ghosts.length > GHOST_N) ghosts.shift();
  };
  api.drawGhosts = function () {
    if (!OK) return;
    for (let i = ghosts.length - 1; i >= 0; i--) {
      const g = ghosts[i];
      ctx.save();
      ctx.globalAlpha = (g.t / 9) * 0.32;
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(g.img, g.x - COX, g.y - COY, CW, CH);
      ctx.restore();
      if (--g.t <= 0) ghosts.splice(i, 1);
    }
  };
  api.clearGhosts = function () { ghosts.length = 0; };

  /* ---------- ポストプロセス ---------- */
  function ensurePost() {
    const w = canvas.width, h = canvas.height;
    if (postW === w && postH === h && bloomA) return true;
    postW = w; postH = h;
    const bw = Math.max(1, Math.round(w / 5)), bh = Math.max(1, Math.round(h / 5));
    bloomA = mk(bw, bh); bloomB = mk(bw, bh);
    return !!(bloomA && bloomB);
  }

  // グレード + ビネットは 1 枚の乗算オーバーレイに焼いて使い回す
  let overlay = null;
  function ensureOverlay(w, h) {
    if (overlay && overlay.c.width === w && overlay.c.height === h) return overlay;
    overlay = mk(w, h); if (!overlay) return null;
    const g = overlay.g;
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, '#cfe0ff');
    grd.addColorStop(0.55, '#ffffff');
    grd.addColorStop(1, '#ffd9b8');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    // ビネットは「暗くする＝乗算」なので同じ 1 枚に焼ける
    g.globalCompositeOperation = 'multiply';
    const vg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.30,
                                      w / 2, h / 2, Math.max(w, h) * 0.74);
    vg.addColorStop(0, 'rgba(255,255,255,1)');
    vg.addColorStop(1, 'rgba(122,122,122,1)');
    g.fillStyle = vg; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'source-over';
    return overlay;
  }

  api.post = function () {
    if (!OK) return;
    const w = canvas.width, h = canvas.height;

    // --- ブルーム（明部を抽出 → 縮小してぼかす → 加算） ---
    if (FILTER && tier >= 2 && ensurePost()) {
      const bw = bloomA.c.width, bh = bloomA.c.height;
      const ga = bloomA.g, gb = bloomB.g;
      ga.setTransform(1, 0, 0, 1, 0, 0);
      ga.globalCompositeOperation = 'source-over';
      ga.clearRect(0, 0, bw, bh);
      ga.drawImage(canvas, 0, 0, w, h, 0, 0, bw, bh);   // まず縮小（フィルタなし）
      gb.setTransform(1, 0, 0, 1, 0, 0);
      gb.clearRect(0, 0, bw, bh);
      gb.filter = 'brightness(0.5) contrast(9) saturate(1.3) blur(4px)';
      gb.drawImage(bloomA.c, 0, 0);                     // 重い処理は小バッファ上で
      gb.filter = 'none';
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.50;
      ctx.drawImage(bloomB.c, 0, 0, w, h);
      ctx.restore();
    }

    // --- カラーグレード + ビネット（焼き込み済みの 1 枚を乗算） ---
    const ov = ensureOverlay(w, h);
    if (ov) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = 1;
      ctx.drawImage(ov.c, 0, 0);
      ctx.restore();
    }
  };

  return api;
})();

// ---- Seeded PRNG (gameplay uses this for determinism across clients) ----
let _rngState = 1;
function seedRng(s) { _rngState = ((s >>> 0) || 1); }
function gameRand() {
  _rngState ^= _rngState << 13;
  _rngState ^= _rngState >>> 17;
  _rngState ^= _rngState << 5;
  return (_rngState >>> 0) / 4294967296;
}

// ---- Audio ----
const audio = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, type, dur, vol = 0.25) {
  try {
    const o = audio.createOscillator(), g = audio.createGain();
    o.connect(g); g.connect(audio.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.start(); o.stop(audio.currentTime + dur);
  } catch(e) {}
}

// Touch binding helpers — use both touch and pointer events for reliability
function bindHold(el, code) {
  const on  = e => { e.preventDefault(); keys[code] = true;  el.classList.add('active'); };
  const off = e => { e.preventDefault(); keys[code] = false; el.classList.remove('active'); };
  el.addEventListener('pointerdown',   on,  {passive: false});
  el.addEventListener('pointerup',     off, {passive: false});
  el.addEventListener('pointercancel', off, {passive: false});
  el.addEventListener('pointerleave',  off, {passive: false});
  el.addEventListener('touchstart',    on,  {passive: false});
  el.addEventListener('touchend',      off, {passive: false});
  el.addEventListener('touchcancel',   off, {passive: false});
}
function bindTap(el, code) {
  const on  = e => { e.preventDefault(); keys[code] = true; };
  const off = e => { e.preventDefault(); keys[code] = false; };
  el.addEventListener('pointerdown', on,  {passive: false});
  el.addEventListener('pointerup',   off, {passive: false});
  el.addEventListener('touchstart',  on,  {passive: false});
  el.addEventListener('touchend',    off, {passive: false});
}

// Canvas tap handler for charselect & intro
canvas.addEventListener('pointerdown', e => {
  if (audio.state === 'suspended') audio.resume();
  const inFight = phase==='fight'||phase==='roundend'||phase==='countdown';
  if (inFight) {
    const rect = canvas.getBoundingClientRect();
    const ex = (e.clientX - rect.left) * (W / rect.width);
    const ey = (e.clientY - rect.top)  * (H / rect.height);
    if (ex>=EXIT_BTN.x&&ex<=EXIT_BTN.x+EXIT_BTN.w&&ey>=EXIT_BTN.y&&ey<=EXIT_BTN.y+EXIT_BTN.h) {
      exitToMenu(); return;
    }
  }
  if (phase === 'intro') { keys['Enter'] = true; return; }
  if (phase === 'modeselect' || phase === 'charselect' || phase === 'netwait' || phase === 'stageselect') {
    const rect2 = canvas.getBoundingClientRect();
    const bex = (e.clientX - rect2.left) * (W / rect2.width);
    const bey = (e.clientY - rect2.top)  * (H / rect2.height);
    if (bex >= 12 && bex <= 100 && bey >= H-42 && bey <= H-14) {
      if (phase === 'netwait') {
        if(netWs){try{netWs.close();}catch(ex){} netWs=null;}
        phase='modeselect'; beep(300,'sine',0.08); return;
      }
      if (phase === 'stageselect') {
        selectStep=1; phase='charselect'; beep(300,'sine',0.08); return;
      }
      if (phase === 'charselect') {
        if (gameMode==='net') {
          if(netWs){try{netWs.close();}catch(ex){} netWs=null;}
          phase='modeselect'; beep(300,'sine',0.08); return;
        }
        if (selectStep === 1) { selectStep = 0; beep(300,'sine',0.08); return; }
        modeSelectStep=0; phase='modeselect'; beep(300,'sine',0.08); return;
      }
      if (modeSelectStep === 1) { modeSelectStep=0; beep(300,'sine',0.08); return; }
      phase='intro'; beep(300,'sine',0.08); return;
    }
  }
  if (phase === 'modeselect') {
    const rect = canvas.getBoundingClientRect();
    const scaleY = H / rect.height;
    const ty = (e.clientY - rect.top) * scaleY;
    if (modeSelectStep === 1) {
      if (ty >= 200 && ty < 260) { cpuDifficulty='weak'; beep(350,'sine',0.08); }
      else if (ty >= 280 && ty < 340) { cpuDifficulty='normal'; beep(350,'sine',0.08); }
      else if (ty >= 360 && ty < 420) { cpuDifficulty='strong'; beep(350,'sine',0.08); }
      keys['Enter'] = true; return;
    }
    if (ty >= 130 && ty < 205) { gameMode='cpu'; beep(350,'sine',0.08); modeSelectStep=1; return; }
    else if (ty >= 230 && ty < 305) { gameMode='2p'; beep(350,'sine',0.08); keys['Enter'] = true; }
    else if (ty >= 330 && ty < 405) { gameMode='net'; beep(350,'sine',0.08); connectNet(); }
    return;
  }
  if (phase === 'charselect') {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY2 = H / rect.height;
    const tx = (e.clientX - rect.left) * scaleX;
    const tcy = (e.clientY - rect.top) * scaleY2;
    const CS_COLS=9, CS_PW=84, CS_PH=185, CS_GAP=4, CS_SX=6, CS_SY=68;
    for (let idx=0; idx<CHAR_LIST.length; idx++) {
      const col=idx%CS_COLS, row=Math.floor(idx/CS_COLS);
      const px=CS_SX+col*(CS_PW+CS_GAP), py=CS_SY+row*(CS_PH+CS_GAP);
      if (tx>=px&&tx<=px+CS_PW&&tcy>=py&&tcy<=py+CS_PH) {
        if (gameMode==='net') selectedCharIdx=idx;
        else if (selectStep===0) selectedCharIdx=idx;
        else cpuCharIdx=idx;
        beep(350,'sine',0.08);
        break;
      }
    }
  }
  if (phase === 'stageselect') {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY2 = H / rect.height;
    const tx = (e.clientX - rect.left) * scaleX;
    const tcy = (e.clientY - rect.top) * scaleY2;
    const gap=20,bh=250,bw=Math.min(340,(W-40-(STAGE_COUNT-1)*gap)/STAGE_COUNT);
    const sx=(W-STAGE_COUNT*bw-(STAGE_COUNT-1)*gap)/2;
    const by=88;
    for (let i=0;i<STAGE_COUNT;i++) {
      const bx=sx+i*(bw+gap);
      if (tx>=bx&&tx<=bx+bw&&tcy>=by&&tcy<=by+bh) {
        if (selectedStage===i) {
          startRound(); phase='countdown';
          showFlash(`ROUND ${roundNum}`,80);
          setTimeout(()=>showFlash('FIGHT!',70),1200);
          setTimeout(()=>{phase='fight';},1800);
          beep(523,'sine',0.3,0.4);
        } else {
          selectedStage=i; beep(350,'sine',0.08);
        }
        return;
      }
    }
  }
});

/* ==================================================================
   ステージ描画（描画のみ。判定・座標系は従来どおり GROUND を基準）
   静的な部分はオフスクリーンに一度だけ焼き、毎フレームは 1 回の

// 見た目用の決定的ハッシュ（gameRand はゲーム進行用なので使わない）
function sh(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ---------------- 夜の街 ---------------- */
const NIGHT = (function () {
  const far = [], mid = [], neon = [], stars = [], flick = [];
  let x = -40;
  while (x < W + 60) {
    const w = 34 + sh(x) * 40, h = 70 + sh(x + 7) * 110;
    far.push({ x, w, h }); x += w + 6 + sh(x + 3) * 10;
  }
  x = -50;
  while (x < W + 70) {
    const w = 58 + sh(x + 11) * 62, h = 120 + sh(x + 17) * 165;
    const wins = [];
    for (let wy = GROUND - h + 16; wy < GROUND - 26; wy += 20)
      for (let wx = x + 9; wx < x + w - 14; wx += 17) {
        const r = sh(wx * 3 + wy);
        if (r <= 0.34) continue;
        if (r > 0.93) flick.push([wx, wy, r]); else wins.push([wx, wy, r]);
      }
    mid.push({ x, w, h, wins, tone: sh(x + 29) });
    x += w + 4 + sh(x + 5) * 14;
  }
  const words = ['酒', '食', '本', 'B', '湯', '麺'];
  for (let i = 0; i < 6; i++) {
    neon.push({ x: 40 + i * 132 + sh(i * 9) * 40, y: 96 + sh(i * 13) * 96,
                t: words[i % words.length], hue: Math.floor(sh(i * 31) * 360), ph: sh(i * 7) * 6.28 });
  }
  for (let i = 0; i < 80; i++) stars.push({ x: sh(i * 2.3) * W, y: sh(i * 5.7) * 205, s: sh(i * 1.9) });
  return { far, mid, neon, stars, flick, lamps: [180, 470, 720] };
})();

// 静的レイヤ（1度だけ焼く）
function drawNightStatic(ctx) {
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0.00, '#070417');
  sky.addColorStop(0.42, '#1b1038');
  sky.addColorStop(0.72, '#4a1f3e');
  sky.addColorStop(1.00, '#8a3520');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, GROUND);

  // 月
  const mx = 300, my = 58;
  const mg = ctx.createRadialGradient(mx, my, 6, mx, my, 92);
  mg.addColorStop(0, 'rgba(255,246,214,0.40)');
  mg.addColorStop(0.35, 'rgba(255,228,180,0.12)');
  mg.addColorStop(1, 'rgba(255,210,150,0)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, 92, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.arc(mx, my, 26, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(214,196,158,0.5)';
  [[-8, -6, 6], [6, 4, 4.5], [-2, 10, 3], [11, -9, 3.2]].forEach(c => {
    ctx.beginPath(); ctx.arc(mx + c[0], my + c[1], c[2], 0, Math.PI * 2); ctx.fill();
  });

  // 遠景ビル
  const fg = ctx.createLinearGradient(0, GROUND - 190, 0, GROUND);
  fg.addColorStop(0, 'rgba(58,40,86,0.85)');
  fg.addColorStop(1, 'rgba(96,52,74,0.85)');
  ctx.fillStyle = fg;
  NIGHT.far.forEach(b => ctx.fillRect(b.x, GROUND - b.h, b.w, b.h));

  // 中景ビル + 窓
  NIGHT.mid.forEach(b => {
    const base = 16 + b.tone * 14;
    const g = ctx.createLinearGradient(b.x, 0, b.x + b.w, 0);
    g.addColorStop(0, `rgb(${base + 10},${base + 4},${base + 26})`);
    g.addColorStop(1, `rgb(${base - 6},${base - 8},${base + 12})`);
    ctx.fillStyle = g; ctx.fillRect(b.x, GROUND - b.h, b.w, b.h);
    ctx.fillStyle = 'rgba(140,120,170,0.30)';
    ctx.fillRect(b.x - 2, GROUND - b.h - 3, b.w + 4, 4);
    b.wins.forEach(w => {
      ctx.fillStyle = w[2] > 0.5 ? 'rgba(255,206,116,0.70)' : 'rgba(150,205,255,0.52)';
      ctx.fillRect(w[0], w[1], 7, 9);
    });
  });

  // 地平のもや
  const haze = ctx.createLinearGradient(0, GROUND - 120, 0, GROUND);
  haze.addColorStop(0, 'rgba(255,130,60,0)');
  haze.addColorStop(1, 'rgba(255,140,70,0.22)');
  ctx.fillStyle = haze; ctx.fillRect(0, GROUND - 120, W, 120);

  // 街灯の光のコーン（静的）
  NIGHT.lamps.forEach(lx => {
    const lampX = lx + 30, lampY = GROUND - 146;
    const cone = ctx.createLinearGradient(lampX, lampY, lampX, GROUND);
    cone.addColorStop(0, 'rgba(255,220,150,0.20)');
    cone.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = cone;
    ctx.beginPath(); ctx.moveTo(lampX - 8, lampY);
    ctx.lineTo(lampX + 74, GROUND); ctx.lineTo(lampX - 90, GROUND); ctx.closePath(); ctx.fill();
  });

  // ガードレール・電柱・電線
  ctx.fillStyle = 'rgba(12,8,22,0.92)';
  ctx.fillRect(0, GROUND - 30, W, 5);
  for (let px = 20; px < W; px += 96) ctx.fillRect(px, GROUND - 30, 5, 30);
  ctx.fillRect(96, GROUND - 168, 9, 168);
  ctx.fillRect(60, GROUND - 160, 82, 5);
  ctx.strokeStyle = 'rgba(12,8,22,0.85)'; ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++) {
    ctx.beginPath(); ctx.moveTo(0, GROUND - 150 + k * 7);
    ctx.quadraticCurveTo(W / 2, GROUND - 132 + k * 7, W, GROUND - 152 + k * 7); ctx.stroke();
  }
  NIGHT.lamps.forEach(lx => {
    ctx.fillStyle = 'rgba(14,10,24,0.95)';
    ctx.fillRect(lx - 3, GROUND - 150, 6, 150);
    ctx.fillRect(lx - 3, GROUND - 152, 34, 5);
  });

  // 濡れたアスファルト
  const gr = ctx.createLinearGradient(0, GROUND, 0, CANVAS_H);
  gr.addColorStop(0, '#241426'); gr.addColorStop(0.35, '#1a0e1c'); gr.addColorStop(1, '#0a050c');
  ctx.fillStyle = gr; ctx.fillRect(0, GROUND, W, CANVAS_H - GROUND);
  ctx.fillStyle = 'rgba(255,168,96,0.55)'; ctx.fillRect(0, GROUND - 1, W, 2);
  ctx.fillStyle = 'rgba(255,210,150,0.16)'; ctx.fillRect(0, GROUND + 1, W, 1);

  // 路面に落ちる街灯の反射
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const h2 = CANVAS_H - GROUND;
  NIGHT.lamps.forEach((lx, i) => {
    const rg = ctx.createRadialGradient(lx + 30, GROUND + 4, 2, lx + 30, GROUND + 4, h2 * 1.5);
    rg.addColorStop(0, 'rgba(255,206,140,0.30)');
    rg.addColorStop(0.45, 'rgba(255,180,110,0.09)');
    rg.addColorStop(1, 'rgba(255,170,100,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.ellipse(lx + 30, GROUND + h2 * 0.45, 26 + i * 4, h2 * 0.95, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();

  // 水たまり
  ctx.globalAlpha = 0.30;
  [[120, 26], [360, 18], [620, 30], [770, 16]].forEach((pd, i) => {
    const py = GROUND + 24 + i * 12;
    const pg = ctx.createRadialGradient(pd[0], py, 1, pd[0], py, pd[1] * 2);
    pg.addColorStop(0, 'rgba(180,200,255,0.55)');
    pg.addColorStop(1, 'rgba(120,140,220,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.ellipse(pd[0], py, pd[1] * 2, pd[1] * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,190,110,0.10)';
  for (let i = -20; i < W + 40; i += 62) ctx.fillRect(i, GROUND + 44, 34, 4);
}

// 動く部分だけを毎フレーム重ねる
function drawNightAnim(t) {
  NIGHT.stars.forEach((s, i) => {
    ctx.globalAlpha = (1 - s.y / 240) * 0.75 * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 1.7 + i)));
    ctx.fillStyle = '#dfe8ff';
    const d = s.s > 0.85 ? 2 : 1;
    ctx.fillRect(s.x, s.y, d, d);
  });
  ctx.globalAlpha = 0.14;
  for (let i = 0; i < 3; i++) {
    const cw = 260 + i * 70, cx = ((t * (5 + i * 2) + i * 260) % (W + cw * 2)) - cw, cy = 40 + i * 28;
    ctx.fillStyle = 'rgba(185,152,212,0.85)';
    ctx.beginPath(); ctx.ellipse(cx, cy, cw * 0.5, 12, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 明滅する窓
  NIGHT.flick.forEach(w => {
    if (Math.sin(t * 6 + w[0]) > 0) { ctx.fillStyle = 'rgba(255,214,130,0.72)'; ctx.fillRect(w[0], w[1], 7, 9); }
  });
  // 航空障害灯
  NIGHT.mid.forEach((b, bi) => {
    if (bi % 3) return;
    ctx.fillStyle = `rgba(255,70,70,${0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 2.4 + bi))})`;
    ctx.beginPath(); ctx.arc(b.x + b.w / 2, GROUND - b.h - 6, 2.6, 0, Math.PI * 2); ctx.fill();
  });
  // ネオン
  NIGHT.neon.forEach(n => {
    const pulse = 0.62 + 0.38 * (0.5 + 0.5 * Math.sin(t * 3.1 + n.ph));
    const col = `hsl(${n.hue} 95% 62%)`;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = `hsla(${n.hue} 95% 60% / 0.16)`;
    ctx.fillRect(n.x - 15, n.y - 22, 30, 46);
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.strokeRect(n.x - 15, n.y - 22, 30, 46);
    ctx.fillStyle = col; ctx.font = 'bold 17px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(n.t, n.x, n.y + 6);
    ctx.globalAlpha = 1;
  });
  // 街灯の光球
  NIGHT.lamps.forEach((lx, i) => {
    const fl = 0.86 + 0.14 * Math.sin(t * 9 + i * 2);
    const gg = ctx.createRadialGradient(lx + 30, GROUND - 146, 1, lx + 30, GROUND - 146, 26);
    gg.addColorStop(0, `rgba(255,236,180,${0.95 * fl})`);
    gg.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(lx + 30, GROUND - 146, 26, 0, Math.PI * 2); ctx.fill();
  });
}

function drawBackground() {
  const t = (typeof _lastLoopTs === 'number' ? _lastLoopTs : Date.now()) * 0.001;

  if (selectedStage === 1) { GFX.stage('ueda', drawUedaStatic); drawUedaAnim(t); return; }
  GFX.stage('night', drawNightStatic); drawNightAnim(t);
}

function drawUedaStatic(ctx) {

  ctx.fillStyle = wall; ctx.fillRect(0, 0, W, GROUND);
  ctx.globalAlpha = 0.06; ctx.fillStyle = '#5a4630';
  for (let i = 0; i < W; i += 26) ctx.fillRect(i, 0, 11, GROUND);
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(60,44,30,0.45)'; ctx.fillRect(0, 0, W, 16);
  ctx.fillStyle = '#efe6d4'; ctx.fillRect(0, 16, W, 7);
  ctx.fillStyle = '#e6dcc8'; ctx.fillRect(0, GROUND - 26, W, 26);
  ctx.fillStyle = 'rgba(90,70,48,0.35)'; ctx.fillRect(0, GROUND - 28, W, 3);

  const lampX = UEDA.lampX;
  const pool = ctx.createRadialGradient(lampX, 30, 20, lampX, 220, 430);
  pool.addColorStop(0, 'rgba(255,236,190,0.30)');
  pool.addColorStop(0.55, 'rgba(255,222,168,0.10)');
  pool.addColorStop(1, 'rgba(255,210,150,0)');
  ctx.fillStyle = pool; ctx.fillRect(0, 0, W, GROUND);
  ctx.fillStyle = 'rgba(70,54,36,0.8)'; ctx.fillRect(lampX - 2, 16, 4, 22);

function drawUedaAnim(t) {
  // テレビ画面
  const x = UEDA.tv.x, y = UEDA.tv.y, hue = (t * 26) % 360;
  const scr = ctx.createLinearGradient(0, y + 6, 0, y + 84);
  scr.addColorStop(0, `hsl(${hue} 78% 46%)`);
  scr.addColorStop(0.5, `hsl(${(hue + 40) % 360} 70% 30%)`);
  scr.addColorStop(1, `hsl(${(hue + 90) % 360} 66% 20%)`);
  ctx.fillStyle = scr; ctx.fillRect(x + 2, y + 6, 134, 78);
  ctx.globalAlpha = 0.28; ctx.fillStyle = '#fff';
  for (let i = 0; i < 4; i++) ctx.fillRect(x + 2, y + 6 + ((t * 42 + i * 22) % 78), 134, 2);
  ctx.globalAlpha = 1;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.14;
  const glow = ctx.createRadialGradient(x + 69, y + 45, 10, x + 69, y + 45, 170);
  glow.addColorStop(0, `hsl(${hue} 80% 60%)`); glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(x - 110, y - 50, 360, 260);
  ctx.restore();
  // 時計の針
  const ck = UEDA.clock, now = new Date();
  const mn = now.getMinutes() + now.getSeconds() / 60, hr = (now.getHours() % 12) + mn / 60;
  ctx.strokeStyle = '#2e2418'; ctx.lineCap = 'round';
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(ck.x, ck.y);
  ctx.lineTo(ck.x + Math.sin(hr / 12 * 6.283) * 10, ck.y - Math.cos(hr / 12 * 6.283) * 10); ctx.stroke();
  ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ck.x, ck.y);
  ctx.lineTo(ck.x + Math.sin(mn / 60 * 6.283) * 15, ck.y - Math.cos(mn / 60 * 6.283) * 15); ctx.stroke();
}

  for (let i = 0; i < 9; i++) {
    const a = -1.9 + i * 0.42, len = 48 + sh(i * 4.3) * 34;

    ctx.stroke();
  }
}

// ---- Pencil Hazard Functions ----
function spawnPencil() {
  pencils.push({x:90+Math.random()*(W-180), y:-30, vy:2.5, phase:'falling', t:0, atkDone:false});
}
function updatePencils(p1, p2) {
  if (++pencilSpawnTimer >= 300) {
    pencilSpawnTimer=0;
    if (Math.random()<0.2) spawnPencil();
  }
  for (let i=pencils.length-1;i>=0;i--) {
    const pen=pencils[i];
    if (pen.phase==='falling') {
      pen.vy=Math.min(pen.vy+0.55,16); pen.y+=pen.vy;
      if (pen.y>=GROUND) {
        pen.y=GROUND; pen.phase='grounded'; pen.t=200;
        beep(220,'sine',0.1,0.18); spawnHit(pen.x,GROUND-5);
      }
    } else {
      if (--pen.t<=0){pencils.splice(i,1);continue;}
      if (!pen.atkDone) {
        for (const p of [p1,p2]) {
          if (!p.onGround||p.hp<=0) continue;
          if (Math.abs(p.x-pen.x)<26) {
            p.takeHit({dmg:10,stun:28,push:15,type:'special'},p.x<pen.x?-1:1);
            spawnHit(pen.x,GROUND-12);
            beep(350,'sawtooth',0.18,0.25);
            pen.atkDone=true; pen.t=Math.min(pen.t,30); break;
          }
        }
      }
    }
  }
}
function drawPencils() {
  pencils.forEach(pen=>{
    ctx.save();
    if (pen.phase==='falling') {
      ctx.translate(pen.x,pen.y-24);
      ctx.rotate(0.18);
      ctx.fillStyle='#FFE033'; ctx.fillRect(-4,-22,8,46);
      ctx.fillStyle='#FF99AA'; ctx.fillRect(-4,24,8,9);
      ctx.fillStyle='#AAAAAA'; ctx.fillRect(-4,19,8,6);
      ctx.fillStyle='#C8A060'; ctx.beginPath(); ctx.moveTo(-4,-22); ctx.lineTo(0,-33); ctx.lineTo(4,-22); ctx.fill();
      ctx.fillStyle='#333'; ctx.beginPath(); ctx.moveTo(-2,-24); ctx.lineTo(0,-33); ctx.lineTo(2,-24); ctx.fill();
    } else {
      ctx.translate(pen.x,pen.y-4);
      ctx.rotate(0.12);
      ctx.fillStyle='#FFE033'; ctx.fillRect(-27,-4,52,8);
      ctx.fillStyle='#FF99AA'; ctx.fillRect(25,-4,8,8);
      ctx.fillStyle='#AAAAAA'; ctx.fillRect(20,-4,6,8);
      ctx.fillStyle='#C8A060'; ctx.beginPath(); ctx.moveTo(-27,-4); ctx.lineTo(-35,0); ctx.lineTo(-27,4); ctx.fill();
      ctx.fillStyle='#333'; ctx.beginPath(); ctx.moveTo(-29,-2); ctx.lineTo(-35,0); ctx.lineTo(-29,2); ctx.fill();
      if (!pen.atkDone) {
        ctx.restore(); ctx.save();
        ctx.globalAlpha=0.28+0.18*Math.sin(Date.now()/140);
        ctx.strokeStyle='#ff4400'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(pen.x,pen.y-4,32,0,Math.PI*2); ctx.stroke();
      }
    }
    ctx.restore();
  });
}

  const rows=[{y:214,sc:0.72},{y:262,sc:0.85},{y:312,sc:1.0}]; // 奥ほど上・小さい
  const cols=5;
  const pal=['#e2445b','#3aa9a8','#3f7fcc','#e39328','#7fbf3f','#c05fc0','#28b8c8','#e2745b'];
  rows.forEach((r,ri)=>{
    const margin=96;
    for(let c=0;c<cols;c++){
      const x=margin + c*((W-2*margin)/(cols-1));
      SCH_DESKS.push({x,y:r.y,sc:r.sc});
      students.push({hx:x,hy:r.y,x,y:r.y,sc:r.sc,face:1,col:pal[(ri*cols+c)%pal.length],state:'seated',nextActive:SCH_STAND_DELAY,hitCd:0,wob:Math.random()*6.28});
    }
  });
  teacher={x:W/2,y:GROUND,dir:1,state:'patrol',target:null,angryT:0,hitCd:0,step:0};
}
function schAlive(p1,p2){ return [p1,p2].filter(p=>p&&p.hp>0); }
function schNearest(x,fs){ let b=null,bd=1e9; for(const f of fs){const d=Math.abs(f.x-x); if(d<bd){bd=d;b=f;}} return b; }
function schNorm(hb){ const x=hb.w<0?hb.x+hb.w:hb.x; return {x,y:hb.y,w:Math.abs(hb.w),h:hb.h}; }
function schRectHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function schMark(x,y,txt,col){ schoolMarks.push({x,y,txt,col:col||'#ff3b30',t:50}); }

function updateSchool(p1,p2){
  schoolTimer++;
  const fs=schAlive(p1,p2);
  // --- 生徒 ---
  for(const s of students){
    if(s.hitCd>0) s.hitCd--;
    if(s.state==='seated'){
      s.wob+=0.05;
      if(schoolTimer>=s.nextActive && fs.length){ s.state='chase'; beep(300,'square',0.05,0.07); }
    } else if(s.state==='chase'){
      const tgt=schNearest(s.x,fs);
      if(!tgt){ s.state='return'; continue; }
      if(s.y<GROUND) s.y=Math.min(GROUND,s.y+2.6);
      s.face=Math.sign(tgt.x-s.x)||s.face;
      s.x+=s.face*SCH_STU_SPD;
      if(Math.abs(tgt.x-s.x)<SCH_STU_CATCH && s.y>=GROUND-2 && s.hitCd<=0 && tgt.onGround && tgt.hitStun===0){
        if(tgt.takeHit(SCH_STU_HIT, tgt.x<s.x?-1:1)){ spawnHit(tgt.x,tgt.y-46); beep(360,'square',0.08,0.16); schMark(tgt.x,tgt.y-70,'ペチ'); }
        s.hitCd=SCH_STU_COOLDOWN; s.state='return';
      }
    } else if(s.state==='return'){
      s.face=Math.sign(s.hx-s.x)||s.face;
      s.x+=s.face*(SCH_STU_SPD+0.6);
      if(s.y>s.hy) s.y=Math.max(s.hy,s.y-2.6);
      if(Math.abs(s.hx-s.x)<3 && Math.abs(s.hy-s.y)<3){ s.x=s.hx; s.y=s.hy; s.state='seated'; s.nextActive=schoolTimer+SCH_STU_COOLDOWN; }
    }
  }
  // --- 先生 ---
  const t=teacher; if(!t) return;
  if(t.hitCd>0) t.hitCd--;
  t.step+=1;
  if(t.hitCd<=0 && t.state!=='angry'){
    const trect={x:t.x-16,y:GROUND-74,w:32,h:74};
    for(const p of fs){
      const hb=p.hitbox&&p.hitbox();
      if(hb && schRectHit(schNorm(hb),trect)){
        t.state='angry'; t.target=p; t.angryT=480; t.hitCd=30;
        spawnHit(t.x,GROUND-70,true); schMark(t.x,GROUND-92,'💢','#ff3b30'); beep(170,'sawtooth',0.2,0.3);
        break;
      }
    }
  }
  if(t.state==='patrol'){
    t.x+=t.dir*SCH_TEACH_SPD;
    if(t.x<70){t.x=70;t.dir=1;} if(t.x>W-70){t.x=W-70;t.dir=-1;}
  } else {
    const tg=(t.target&&t.target.hp>0)?t.target:schNearest(t.x,fs);
    if(!tg||--t.angryT<=0){ t.state='patrol'; t.target=null; }
    else {
      t.dir=Math.sign(tg.x-t.x)||t.dir;
      t.x=Math.max(50,Math.min(W-50,t.x+t.dir*SCH_TEACH_CHASE));
      if(Math.abs(tg.x-t.x)<SCH_TEACH_CATCH && tg.onGround && tg.hitStun===0){
        if(tg.takeHit(SCH_TEACH_HIT, tg.x<t.x?-1:1)){ spawnHit(tg.x,tg.y-52,true); spawnHit(tg.x-6,tg.y-66); beep(320,'sawtooth',0.12,0.26); schMark(tg.x,tg.y-84,'2発!','#ffcc00'); }
        t.state='patrol'; t.target=null; t.hitCd=120;
      }
    }
  }
}

function schDrawDesk(x,y,sc){
  const w=44*sc, legH=26*sc;
  ctx.fillStyle='#8f7038'; ctx.fillRect(x-w/2+3,y+2,4*sc,legH); ctx.fillRect(x+w/2-3-4*sc,y+2,4*sc,legH);

function drawSchool(){
  for(const s of students) schDrawStudent(s);
  if(teacher) schDrawTeacher(teacher);
  for(let i=schoolMarks.length-1;i>=0;i--){ const m=schoolMarks[i];
    ctx.globalAlpha=Math.min(1,m.t/18); ctx.fillStyle=m.col; ctx.font='bold 19px sans-serif'; ctx.textAlign='center';
    ctx.fillText(m.txt,m.x,m.y-(50-m.t)*0.5); ctx.globalAlpha=1; if(--m.t<=0) schoolMarks.splice(i,1); }
}
function schDrawStudent(s){
  const sc=s.sc, seated=s.state==='seated';
  ctx.save(); ctx.translate(s.x,s.y);
  const wob=seated?Math.sin(s.wob)*1.2:0;
  if(!seated){ ctx.fillStyle='#33384a'; ctx.fillRect(-6*sc,-12*sc,4.5*sc,12*sc); ctx.fillRect(1.5*sc,-12*sc,4.5*sc,12*sc); } // 脚
  ctx.fillStyle=s.col; // 制服
  if(seated) ctx.fillRect(-9*sc,-21*sc,18*sc,21*sc); else ctx.fillRect(-9*sc,-31*sc,18*sc,19*sc);
  const headY=seated?-27*sc:-41*sc;
  if(!seated){ // 追跡中は前かがみで手を伸ばす
    ctx.strokeStyle='#ffd9a8'; ctx.lineWidth=3*sc; ctx.beginPath(); ctx.moveTo(0,-24*sc); ctx.lineTo(s.face*12*sc,-20*sc); ctx.stroke();
  }
  ctx.fillStyle='#ffd9a8'; ctx.beginPath(); ctx.arc(wob,headY,8*sc,0,Math.PI*2); ctx.fill(); // 頭
  ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.arc(wob,headY-1.5*sc,8*sc,Math.PI,0); ctx.fill(); // 髪
  if(!seated){ ctx.fillStyle='#222'; ctx.fillRect(wob+s.face*2*sc-1,headY-1,2,2); } // 目
  ctx.restore();
}
function schDrawTeacher(t){
  const angry=t.state==='angry';
  const bob=Math.sin(t.step*0.2)*1.5;
  ctx.save(); ctx.translate(t.x,GROUND);
  ctx.fillStyle='#333'; ctx.fillRect(-8,-22,6,22); ctx.fillRect(2,-22,6,22); // 脚
  ctx.fillStyle=angry?'#b5484a':'#6b7b8c'; ctx.fillRect(-13,-54+bob*0,26,32); // 上着
  ctx.fillStyle='#e8e8e8'; ctx.fillRect(-5,-54,10,32); // シャツ
  ctx.fillStyle='#c0392b'; ctx.fillRect(-2,-54,4,15); // ネクタイ
  ctx.fillStyle='#ffd9a8'; ctx.beginPath(); ctx.arc(0,-64+bob,11,0,Math.PI*2); ctx.fill(); // 頭
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(0,-66+bob,11,Math.PI,0); ctx.fill(); // 髪
  ctx.strokeStyle='#222'; ctx.lineWidth=1.5; ctx.strokeRect(-8,-66+bob,6,5); ctx.strokeRect(2,-66+bob,6,5); // メガネ
  if(angry){ ctx.strokeStyle='#c0392b'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-9,-72+bob); ctx.lineTo(-3,-68+bob); ctx.moveTo(9,-72+bob); ctx.lineTo(3,-68+bob); ctx.stroke(); }
  // 指し棒
  ctx.strokeStyle='#8a5a2a'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(t.dir*8,-38); ctx.lineTo(t.dir*26,-30); ctx.stroke();

const effects = [];
let screenFlash = {t:0, color:'#fff'};
let specialBanner = {name:'', color:'#fff', t:0};
let superFlash = {t:0, color:'#fff', ox:400, oy:225};

function spawnHit(x,y,big=false) {
  effects.push({x,y,t:big?25:18,big,
    parts:(function(){
      const n=big?18:11, out=[];
      for(let i=0;i<n;i++){
        const a=Math.random()*Math.PI*2, sp=(big?4.2:2.6)*(0.5+Math.random());
        out.push({x:0,y:0,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.1,
                  r:(big?3.2:2.1)*(0.5+Math.random()),life:1});
      }
      return out;
    })()});
  if (typeof GFX!=='undefined') { GFX.shake(big?7:3.2, big?12:7); GFX.punch(big?0.030:0.012); }
  beep(big?280:420+Math.random()*180,'square',big?0.2:0.12,big?0.7:0.5);
}
function drawEffects() {
  for (let i=effects.length-1;i>=0;i--) {
    const e=effects[i], maxT=e.big?25:18;
    const a=e.t/maxT;                 // 1 → 0
    const prog=1-a;                   // 0 → 1
    const base=e.big?46:26;
    ctx.save();
    ctx.globalCompositeOperation='lighter';

    // 衝撃リング
    const rr=base*(0.25+prog*1.5);
    ctx.globalAlpha=a*a*0.9;
    ctx.strokeStyle=e.big?'#ffb14d':'#ffe9a0';
    ctx.lineWidth=(e.big?6:3.5)*a;
    ctx.beginPath(); ctx.arc(e.x,e.y,rr,0,Math.PI*2); ctx.stroke();
    // 2枚目の細いリング
    ctx.globalAlpha=a*0.55;
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(e.x,e.y,rr*0.62,0,Math.PI*2); ctx.stroke();

    // 中心のフラッシュ
    const fr=base*0.72*a;
    const fg=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,Math.max(1,fr));
    fg.addColorStop(0,`rgba(255,255,255,${a*0.95})`);
    fg.addColorStop(0.35,e.big?`rgba(255,190,90,${a*0.65})`:`rgba(255,226,140,${a*0.55})`);
    fg.addColorStop(1,'rgba(255,160,60,0)');
    ctx.globalAlpha=1; ctx.fillStyle=fg;
    ctx.beginPath(); ctx.arc(e.x,e.y,Math.max(1,fr),0,Math.PI*2); ctx.fill();

    // 放射状のスパーク（先細り）
    const n=e.big?14:9;
    ctx.strokeStyle=e.big?'#ffd08a':'#fff0b8';
    ctx.lineCap='round';
    for (let k=0;k<n;k++) {
      const ang=k/n*Math.PI*2+(e.big?0.2:0.4);
      const l0=base*0.35*prog, l1=base*(0.6+prog*1.35);
      ctx.globalAlpha=a*a*0.85;
      ctx.lineWidth=(e.big?4:2.6)*a;
      ctx.beginPath();
      ctx.moveTo(e.x+Math.cos(ang)*l0,e.y+Math.sin(ang)*l0);
      ctx.lineTo(e.x+Math.cos(ang)*l1,e.y+Math.sin(ang)*l1);
      ctx.stroke();
    }

    // 飛散する破片
    if (e.parts) {
      ctx.fillStyle=e.big?'#ffcf8a':'#fff2c4';
      e.parts.forEach(pt=>{
        pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.28; pt.vx*=0.96;
        ctx.globalAlpha=a*0.9;
        ctx.beginPath(); ctx.arc(e.x+pt.x,e.y+pt.y,pt.r*a,0,Math.PI*2); ctx.fill();
      });
    }
    ctx.restore();
    ctx.globalAlpha=1;
    if (--e.t<=0) effects.splice(i,1);
  }
}

function triggerSuperFlash(def, ox, oy) {

function drawSuperFlash() {
  if (superFlash.t<=0) return;
  const cx=superFlash.ox, cy=superFlash.oy, col=superFlash.color, t=superFlash.t;
  if (t>40) {
    const a=(t-40)/15*0.92;
    ctx.globalAlpha=a; ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=5; ctx.globalAlpha=a*0.6;
    for (let i=0;i<16;i++) {
      const ang=i/16*Math.PI*2, len=(1-(t-40)/15)*W*1.2;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ang)*len,cy+Math.sin(ang)*len); ctx.stroke();
    }
  } else if (t>15) {
    const prog=(t-15)/25;
    ctx.globalAlpha=prog*0.42; ctx.fillStyle=col; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=3; ctx.globalAlpha=prog*0.75;
    for (let r=0;r<3;r++) {
      const radius=(1-prog)*W*0.9+r*90;
      ctx.beginPath(); ctx.arc(cx,cy,radius,0,Math.PI*2); ctx.stroke();
    }
    ctx.strokeStyle=col; ctx.lineWidth=7; ctx.globalAlpha=prog*0.9;
    ctx.beginPath(); ctx.arc(cx,cy,(1-prog)*W*0.55+25,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=2;
    for (let i=0;i<10;i++) {
      const ang=i/10*Math.PI*2+(1-prog)*Math.PI*2;
      const r1=50+prog*160, r2=r1+50+prog*70;
      ctx.globalAlpha=prog*(0.3+0.7*(Math.sin(t*0.9+i*1.1)*0.5+0.5));
      ctx.beginPath(); ctx.moveTo(cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1);
      ctx.lineTo(cx+Math.cos(ang)*r2,cy+Math.sin(ang)*r2); ctx.stroke();
    }
  } else {
    ctx.globalAlpha=t/15*0.28; ctx.fillStyle=col; ctx.fillRect(0,0,W,H);
  }
  ctx.globalAlpha=1; superFlash.t--;
}

function drawScreenFlash() {
  if (screenFlash.t<=0) return;
  const a = (screenFlash.t/14)*0.55;
  ctx.globalAlpha=a; ctx.fillStyle=screenFlash.color;
  ctx.fillRect(0,0,W,H);
  if (screenFlash.t>8) {
    ctx.globalAlpha=(screenFlash.t-8)/6*0.5; ctx.strokeStyle=screenFlash.color; ctx.lineWidth=6;
    for (let i=0;i<12;i++) {
      const ang=i/12*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(W/2,H/2);
      ctx.lineTo(W/2+Math.cos(ang)*W,H/2+Math.sin(ang)*H); ctx.stroke();
    }
  }
  ctx.globalAlpha=1; screenFlash.t--;
}

function drawSpecialBanner() {
  if (specialBanner.t<=0) return;
  const fade = specialBanner.t>78?(90-specialBanner.t)/12 : specialBanner.t<18?specialBanner.t/18:1;

function updateProjectiles(p1,p2) {
  for (let i=projectiles.length-1;i>=0;i--) {
    const proj=projectiles[i];
    proj.x+=proj.vx;
    if (proj.type==='fireball') {
      proj.vy+=0.35; proj.y+=proj.vy;
      if (proj.y>=GROUND-8&&proj.bounced<3){proj.y=GROUND-8;proj.vy=-(3+gameRand()*2);proj.bounced++;beep(180,'sine',0.03,0.08);}
    } else if (proj.type==='hammer') {
      proj.vy+=0.25; proj.y+=proj.vy;
      if (proj.y>GROUND+5){projectiles.splice(i,1);continue;}
    } else if (proj.type==='lavarock') {
      proj.vy+=0.55; proj.y+=proj.vy;
      if (proj.y>=GROUND){projectiles.splice(i,1);continue;}
    } else if (proj.type==='purpleball') {
      // 茈: 重力なし、周期ダメージ
      if (++proj.dotTimer>=20) {
        proj.dotTimer=0;
        const ptgt=proj.owner===p1?p2:p1;
        if (ptgt.hp>0&&ptgt.hitStun===0) {
          const phurt=ptgt.hurtbox();
          if (proj.x-32<phurt.x+phurt.w&&proj.x+32>phurt.x&&proj.y-32<phurt.y+phurt.h&&proj.y+32>phurt.y) {
            if (ptgt.takeHit({dmg:10,stun:12,push:6,type:'special'},proj.vx>0?1:-1)) {
              spawnHit(ptgt.x,ptgt.y-60); beep(280,'sawtooth',0.1,0.2);
            }
          }
        }
      }
    } else if (proj.type==='flametiger') {
      // 炎虎: 重力なし、相手の高さへゆるく追尾
      proj.y += (proj.ty - proj.y)*0.08;
    } else if (proj.type==='firetornado') {
      // 火の竜巻: 吸い込み＋周期ダメージ（重力なし）
      const ttgt=proj.owner===p1?p2:p1;
      const d=Math.abs(ttgt.x-proj.x);
      if (d<72 && !ttgt.frozenFrames && ttgt.state!=='special' && ttgt.state!=='super') ttgt.x += (proj.x-ttgt.x)*0.10;
      if (++proj.dotTimer>=14) { proj.dotTimer=0;
        if (d<82 && ttgt.hp>0 && ttgt.hitStun===0) {
          if (ttgt.takeHit({dmg:6,stun:8,push:0,type:'special'}, ttgt.x>=proj.x?1:-1)) { spawnHit(ttgt.x,ttgt.y-50); beep(360,'sawtooth',0.05,0.12); }
        }
      }
    } else if (proj.type==='meteor') {
      // 隕石: 落下→着弾で爆発AoE
      proj.vy+=0.35; proj.y+=proj.vy;
      if (proj.y>=GROUND) {
        spawnHit(proj.x, GROUND-20, true); spawnHit(proj.x, GROUND-42, true);
        beep(120,'sawtooth',0.16,0.4);
        const mt=proj.owner===p1?p2:p1;
        if (Math.abs(mt.x-proj.x)<72 && mt.hp>0 && mt.hitStun===0) mt.takeHit({dmg:12,stun:16,push:22,type:'special'}, mt.x>=proj.x?1:-1);
        projectiles.splice(i,1); continue;
      }
    } else if (proj.type==='tsunami') {
      // 津波: 前面の相手を押し込み＋周期ダメージ（重力なし）
      const ttgt=proj.owner===p1?p2:p1; const dir=proj.vx>0?1:-1;
      if (Math.abs(ttgt.x-proj.x)<55 && ttgt.hp>0 && ttgt.state!=='special'&&ttgt.state!=='super'&&!ttgt.frozenFrames) {
        ttgt.x=Math.max(40,Math.min(W-40, ttgt.x+dir*4));
        if (++proj.dotTimer>=16){ proj.dotTimer=0; if (ttgt.hitStun===0 && ttgt.takeHit({dmg:7,stun:8,push:6,type:'special'},dir)) spawnHit(ttgt.x,ttgt.y-50); }
      }
    } else if (proj.type==='waterball') {
      // 水の玉: ゆっくり追尾→接触で5秒閉じ込め、閉じ込め中は追従
      const wt=proj.owner===p1?p2:p1;
      if (proj.trapped) {
        proj.x=wt.x; proj.y=wt.y-38;
        if (wt.trapFrames<=0){ projectiles.splice(i,1); continue; }
      } else {
        proj.x += ((wt.x)-proj.x)*0.03; proj.y += ((wt.y-40)-proj.y)*0.03;
        if (Math.abs(wt.x-proj.x)<28 && Math.abs((wt.y-40)-proj.y)<40 && wt.hp>0 && wt.state!=='special'&&wt.state!=='super') {
          proj.trapped=true; proj.t=320; wt.trapFrames=300; wt.frozenFrames=Math.max(wt.frozenFrames,300);
          beep(180,'sine',0.22,0.4);
        }
      }
    } else if (proj.vy!==undefined){proj.vy+=0.18;proj.y+=proj.vy;
      if(proj.y>=GROUND+5){projectiles.splice(i,1);continue;}
    }
    if (--proj.t<=0||proj.x<-100||proj.x>W+100){projectiles.splice(i,1);continue;}
    const target=proj.owner===p1?p2:p1;
    if (target.hp<=0||target.hitStun>0) continue;
    const hurt=target.hurtbox();
    const isCentered=proj.type==='hammer'||proj.type==='mushroom'||proj.type==='kirbyhammer'||proj.type==='lavarock';
    const px=isCentered?proj.x-22:(proj.vx>0?proj.x-5:proj.x-65);
    const pw=isCentered?44:70;
    const phitR=proj.type==='purpleball'?32:20;
    if (px<hurt.x+hurt.w&&px+pw>hurt.x&&proj.y-phitR<hurt.y+hurt.h&&proj.y+phitR>hurt.y) {
      if (proj.type==='purpleball'||proj.type==='firetornado'||proj.type==='meteor'||proj.type==='tsunami'||proj.type==='waterball') {
        // これらは自前(周期/着弾/閉じ込め)で処理済み。汎用の単発ヒットはしない
      } else if (target.takeHit({dmg:proj.dmg,stun:proj.stun,push:proj.push,type:'special'},proj.vx>0?1:-1)) {
        if (proj.type==='ice') target.frozenFrames=Math.max(target.frozenFrames,140);
        if (proj.type==='baseball'||proj.type==='fire') proj.owner.specialGauge=Math.min(proj.owner.maxSpecialGauge,proj.owner.specialGauge+20);
        spawnHit(target.x,target.y-70);
        if (proj.type!=='dragon') projectiles.splice(i,1);
      }
    }
  }
}

function drawDragonSword(x,y,dir) {
  ctx.save(); ctx.translate(x,y); if(dir===-1) ctx.scale(-1,1);
  ctx.shadowBlur=20; ctx.shadowColor='#00eeff';
  ctx.fillStyle='#0099cc';
  ctx.beginPath();
  ctx.moveTo(58,0); ctx.lineTo(44,-11); ctx.lineTo(26,-9); ctx.lineTo(-36,-10);
  ctx.lineTo(-52,0); ctx.lineTo(-36,10); ctx.lineTo(26,9); ctx.lineTo(44,11);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#55ddff';
  ctx.beginPath(); ctx.moveTo(50,0); ctx.lineTo(26,-5); ctx.lineTo(-30,-6);
  ctx.lineTo(-30,6); ctx.lineTo(26,5); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,160,255,0.8)';
  ctx.beginPath(); ctx.moveTo(8,-9); ctx.lineTo(-2,-34); ctx.lineTo(-15,-24); ctx.lineTo(-22,-9); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-2,-34); ctx.lineTo(-8,-48); ctx.lineTo(-18,-30); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,60,100,0.45)'; ctx.lineWidth=1.2;
  for (let i=-28;i<20;i+=14){ctx.beginPath();ctx.moveTo(i,-8);ctx.lineTo(i+9,8);ctx.stroke();}
  ctx.fillStyle='#ffee00'; ctx.beginPath(); ctx.arc(47,-5,4.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(48,-5,2,0,Math.PI*2); ctx.fill();
  const ft=Date.now()/60;
  ctx.fillStyle='#ff6600';
  ctx.beginPath(); ctx.moveTo(58,0); ctx.lineTo(72+Math.sin(ft)*4,-4); ctx.lineTo(65,2);
  ctx.lineTo(75+Math.sin(ft+1)*3,5); ctx.lineTo(60,7); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ffdd00';
  ctx.beginPath(); ctx.moveTo(58,1); ctx.lineTo(67+Math.sin(ft)*3,0); ctx.lineTo(62,5); ctx.closePath(); ctx.fill();
  const t=Date.now();
  for (let i=1;i<=7;i++) {
    ctx.globalAlpha=(7-i)/7*0.55; ctx.fillStyle='#00ccff';
    ctx.beginPath(); ctx.arc(-50-i*10,Math.sin(t/80+i*1.3)*6,Math.max(1,5.5-i*0.6),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.restore();
}

function drawBaseball(x,y) {
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#cc0000'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(-3,0,8,-0.8,0.8); ctx.stroke();
  ctx.beginPath(); ctx.arc(3,0,8,Math.PI-0.8,Math.PI+0.8); ctx.stroke();
  ctx.strokeStyle='#aaa'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawProjectiles() {
  projectiles.forEach(p => {
    if (p.type==='dragon') drawDragonSword(p.x,p.y,p.vx>0?1:-1);
    else if (p.type==='baseball') drawBaseball(p.x,p.y);
    else if (p.type==='note') {
      ctx.save(); ctx.globalAlpha=Math.min(1,p.t/12);
      ctx.font='bold 20px serif'; ctx.textAlign='center';
      ctx.fillStyle=p.color||'#ff88ff';
      ctx.fillText(p.note,p.x,p.y); ctx.globalAlpha=1; ctx.restore();
    } else if (p.type==='hoge') {
      ctx.save(); ctx.globalAlpha=Math.min(1,p.t/12);
      ctx.font='bold 38px sans-serif'; ctx.textAlign='center';
      ctx.strokeStyle='#000'; ctx.lineWidth=4;
      ctx.strokeText('ほげー',p.x,p.y);
      ctx.fillStyle='#ff44bb'; ctx.fillText('ほげー',p.x,p.y);
      ctx.globalAlpha=1; ctx.restore();
    } else if (p.type==='firetornado') {
      ctx.save(); ctx.translate(p.x,p.y);
      const ft=Date.now()/40;
      for(let i=0;i<11;i++){ const yy=-i*7, rr=7+i*2.3, a=ft+i*0.6;
        ctx.globalAlpha=Math.max(0.15,0.8-i*0.05); ctx.fillStyle=i%2?'#ff5500':'#ffbb00';
        ctx.beginPath(); ctx.ellipse(Math.cos(a)*rr, yy, rr, 4, 0, 0, Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1; ctx.restore();
    } else if (p.type==='meteor') {
      ctx.save(); ctx.translate(p.x,p.y);
      ctx.globalAlpha=0.5; ctx.fillStyle='#ff8800';
      ctx.beginPath(); ctx.moveTo(-6,-26); ctx.lineTo(6,-26); ctx.lineTo(0,4); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1; ctx.fillStyle='#552200'; ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ff6600'; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ffdd00'; ctx.beginPath(); ctx.arc(-1,-1,2.5,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else if (p.type==='tsunami') {
      ctx.save(); ctx.translate(p.x,p.y); const dir=p.vx>0?1:-1; ctx.scale(dir,1);
      const wt=Date.now()/80;
      ctx.fillStyle='#2a6fdb';
      ctx.beginPath(); ctx.moveTo(-42,22); ctx.quadraticCurveTo(-10,-32-Math.sin(wt)*6, 22,-8);
      ctx.quadraticCurveTo(36,4,42,22); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#5a9fe6'; ctx.beginPath(); ctx.moveTo(-30,22); ctx.quadraticCurveTo(-6,-14,18,-2); ctx.quadraticCurveTo(28,6,30,22); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#cfe8ff';
      for(let i=0;i<4;i++){ ctx.globalAlpha=0.8; ctx.beginPath(); ctx.arc(16-i*9, -6-Math.sin(wt+i)*4, 4,0,Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1; ctx.restore();
    } else if (p.type==='waterball') {
      ctx.save(); ctx.translate(p.x,p.y);
      const r=p.trapped?32:16;
      ctx.globalAlpha=0.32; ctx.fillStyle='#3399ff'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=0.8; ctx.strokeStyle='#aad4ff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=0.6; ctx.fillStyle='#eaf6ff'; ctx.beginPath(); ctx.arc(-r*0.3,-r*0.35,r*0.22,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1; ctx.restore();
    } else if (p.type==='ice') {
      ctx.save(); ctx.globalAlpha=0.88;
      ctx.fillStyle='#88eeff'; ctx.strokeStyle='#00aaff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.rect(p.x-18,p.y-13,36,26); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#003355'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
      ctx.fillText('❄',p.x,p.y+5); ctx.globalAlpha=1; ctx.restore();
    } else if (p.type==='fire') {
      ctx.save(); ctx.translate(p.x,p.y);
      const ft=Date.now()/50;
      ctx.fillStyle='#ff8800'; ctx.beginPath(); ctx.ellipse(0,0,18,12,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ffdd00'; ctx.beginPath(); ctx.ellipse(0,0,10,7,0,0,Math.PI*2); ctx.fill();
      for (let i=0;i<5;i++){
        const a=(i/5)*Math.PI*2+ft*0.4, r=13+Math.sin(ft+i)*4;
        ctx.globalAlpha=0.65; ctx.fillStyle='#ff4400';
        ctx.beginPath(); ctx.arc(Math.cos(a)*r*0.7,Math.sin(a)*r*0.4,4,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1; ctx.restore();
    } else if (p.type==='flametiger') {
      // 炎の虎
      ctx.save(); ctx.translate(p.x,p.y); const dir=p.vx>0?1:-1; ctx.scale(dir,1);
      const ft=Date.now()/45;
      // 炎の尾
      ctx.globalAlpha=0.85;
      for (let i=1;i<=7;i++){ ctx.fillStyle=i%2?'#ff5500':'#ffaa00';
        ctx.globalAlpha=(8-i)/8*0.8;
        ctx.beginPath(); ctx.ellipse(-18-i*11, Math.sin(ft+i)*5, 12-i, 9-i*0.6, 0,0,Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1;
      // 体（炎の塊）
      ctx.fillStyle='#ff6600'; ctx.beginPath(); ctx.ellipse(-6,0,22,15,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.ellipse(-6,0,13,9,0,0,Math.PI*2); ctx.fill();
      // 頭
      ctx.fillStyle='#ff7711'; ctx.beginPath(); ctx.arc(14,-2,13,0,Math.PI*2); ctx.fill();
      // 耳
      ctx.beginPath(); ctx.moveTo(6,-12); ctx.lineTo(3,-22); ctx.lineTo(13,-14); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(20,-12); ctx.lineTo(24,-22); ctx.lineTo(14,-14); ctx.closePath(); ctx.fill();
      // 目・牙
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(16,-3,3.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#330000'; ctx.beginPath(); ctx.arc(17,-3,1.6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(20,4); ctx.lineTo(24,4); ctx.lineTo(22,9); ctx.closePath(); ctx.fill();
      // 揺らめき
      ctx.globalAlpha=0.6; ctx.fillStyle='#ffee66';
      for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(2+i*6,-12-Math.abs(Math.sin(ft+i))*8,3,0,Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1; ctx.restore();
    } else if (p.type==='hammer') {
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Date.now()/80+p.x*0.1);
      ctx.fillStyle='#775533'; ctx.fillRect(-5,-18,10,18);
      ctx.fillStyle='#555566'; ctx.fillRect(-14,-30,28,16);
      ctx.restore();
    } else if (p.type==='mushroom') {
      ctx.save(); ctx.translate(p.x,p.y);
      const ms=p.big?2:1; ctx.scale(ms,ms);
      ctx.fillStyle='#ffeecc'; ctx.fillRect(-7,0,14,14);
      ctx.fillStyle='#cc2222'; ctx.beginPath(); ctx.arc(0,-4,16,Math.PI,0); ctx.fill(); ctx.fillRect(-16,-4,32,4);
      ctx.fillStyle='#ffffff';
      [[0,-10],[8,-7],[-8,-7],[4,-15],[-4,-15]].forEach(([sx,sy])=>{ctx.beginPath();ctx.arc(sx,sy,3,0,Math.PI*2);ctx.fill();});
      ctx.restore();
    } else if (p.type==='thunderbolt') {
      const tdir=p.vx>0?1:-1, tbs=p.big?2.2:1.4;
      ctx.save(); ctx.translate(p.x,p.y); ctx.scale(tdir*tbs,tbs);
      ctx.shadowBlur=16; ctx.shadowColor='#ffdd00';
      ctx.globalAlpha=Math.min(1,p.t/12);
      ctx.fillStyle='#ffee00';
      ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(-9,-1); ctx.lineTo(-2,-1);
      ctx.lineTo(-11,13); ctx.lineTo(1,1); ctx.lineTo(-4,1); ctx.lineTo(5,-10);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffffff'; ctx.globalAlpha*=0.55;
      ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(-6,-1); ctx.lineTo(-1,-1);
      ctx.lineTo(-7,12); ctx.lineTo(1,1); ctx.lineTo(-2,1); ctx.lineTo(3,-10);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.restore();
    } else if (p.type==='kirbyhammer') {
      const rot=Date.now()/90*(p.vx>0?1:-1);
      const hs=p.big?2.4:1.6;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(rot); ctx.scale(hs,hs);
      ctx.shadowBlur=p.big?22:14; ctx.shadowColor=p.big?'#ff4400':'#cc7700';
      ctx.fillStyle='#886633'; ctx.fillRect(-4,-22,8,22);
      ctx.fillStyle=p.big?'#cc2200':'#cc7700'; ctx.fillRect(-18,-40,36,22);
      ctx.fillStyle='rgba(255,200,80,0.45)'; ctx.fillRect(-16,-38,34,18);
      ctx.shadowBlur=0; ctx.restore();

      ctx.globalAlpha=1; ctx.restore();
    } else if (p.type==='airgun') {

      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ff8800'; ctx.beginPath(); ctx.arc(-3,-3,5,0,Math.PI*2); ctx.fill();

// ---- Hurdle Attack (そよ special) ----
let hurdleAttack = null;
function activateHurdles(owner, target) {
  const positions=[-80,-25,30,85].map(o=>target.x+o);
  hurdleAttack={positions, ys:positions.map(()=>GROUND+5), owner, elapsed:0, t:130, hit:new Set()};
}
function updateHurdles(p1,p2) {
  if (!hurdleAttack) return;
  if (--hurdleAttack.t<=0){hurdleAttack=null;return;}
  hurdleAttack.elapsed++;
  hurdleAttack.positions.forEach((px,i)=>{
    const delay=i*14, local=hurdleAttack.elapsed-delay;
    if (local<=0){hurdleAttack.ys[i]=GROUND+5;return;}
    if (local<18) hurdleAttack.ys[i]=GROUND-local*4.5;
    else if (local<38) hurdleAttack.ys[i]=GROUND-81;
    else { hurdleAttack.ys[i]=GROUND-81+(local-38)*4.5; if(hurdleAttack.ys[i]>GROUND) hurdleAttack.ys[i]=GROUND+5; }
    if (hurdleAttack.ys[i]<GROUND-10) {
      [p1,p2].forEach((f,fi)=>{
        if (f===hurdleAttack.owner) return;
        const key=`${i}-${fi}`; if (hurdleAttack.hit.has(key)) return;
        const hurt=f.hurtbox();
        if (px-38<hurt.x+hurt.w&&px+38>hurt.x&&hurdleAttack.ys[i]<hurt.y+hurt.h&&hurdleAttack.ys[i]+20>hurt.y) {
          if (f.takeHit({dmg:10,stun:16,push:10,type:'special'},px<f.x?-1:1)) {
            hurdleAttack.hit.add(key); spawnHit(f.x,f.y-50);
          }
        }
      });
    }
  });
}
function drawHurdles() {
  if (!hurdleAttack) return;
  hurdleAttack.positions.forEach((px,i)=>{
    const y=hurdleAttack.ys[i]; if (y>=GROUND) return;
    ctx.strokeStyle='#ff6600'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(px-22,GROUND); ctx.lineTo(px-22,y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px+22,GROUND); ctx.lineTo(px+22,y); ctx.stroke();
    ctx.strokeStyle='#ffdd00'; ctx.lineWidth=9;
    ctx.beginPath(); ctx.moveTo(px-36,y); ctx.lineTo(px+36,y); ctx.stroke();
    ctx.strokeStyle='rgba(255,200,0,0.3)'; ctx.lineWidth=18;
    ctx.beginPath(); ctx.moveTo(px-36,y); ctx.lineTo(px+36,y); ctx.stroke();
  });
}

  const count=6;
  for (let i=0;i<count;i++) {
    const ang=(i/count)*Math.PI*2+gameRand()*0.4-0.2;
    const spd=3.5+gameRand()*2.5;
    const word=WORDS[Math.floor(gameRand()*WORDS.length)];

      text:word,t:80,owner,hit:false,color:`hsl(${Math.floor(Math.random()*360)},80%,70%)`});

class BlackHole {
  constructor(owner,target){
    this.owner=owner; this.target=target;
    this.x=target.x+(owner.x<target.x?25:-25);
    this.y=target.y-75; this.t=180; this.r=0; this.hit=false;
  }

    if(--this.t<=0||this.hit){activeBlackHole=null;return;}
    this.r=Math.min(48,this.r+0.38);
    const target=this.owner===p1?p2:p1;
    const dx=this.x-target.x, dy=this.y-target.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<this.r+28){
      const dir=target.x>=this.x?1:-1;
      if(target.takeHit({dmg:62,stun:70,push:0,type:'special',knockdown:true},dir)){
        spawnHit(this.x,this.y);
        target.vy=-15; target.onGround=false; target.airVx=dir*14;
        this.hit=true; activeBlackHole=null;
      }
      return;
    }
    if(dist<220&&!target.hitStun&&!target.frozenFrames&&target.state!=='super'){
      const pull=0.85*(1-dist/220);
      target.x+=dx/dist*pull;
    }
  }
  draw(){
    if(!this.r||this.hit)return;
    const cx=this.x, cy=this.y, now=Date.now();
    ctx.save();
    ctx.globalAlpha=0.4+0.2*Math.sin(now/110);

    ctx.strokeStyle='rgba(180,0,255,0.55)'; ctx.lineWidth=1.5; ctx.globalAlpha=0.7;
    for(let i=0;i<3;i++){
      const ang=now/180+i*(Math.PI*2/3);
      ctx.beginPath(); ctx.arc(cx,cy,this.r*0.65,ang,ang+Math.PI*0.75); ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.restore();
    ctx.fillStyle='#cc44ff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
    ctx.fillText('ブラックホール',cx,cy-this.r-10);
  }

// ---- Monster Ball System ----
const MB_PRIZES = [
  {id:'unchi',      prob:0.35, label:'💩 うんちが出た！'},
  {id:'hito',       prob:0.23, label:'👤 人が出た！'},
  {id:'pikachu',    prob:0.17, label:'⚡ ピカチュウが出た！'},
  {id:'gorilla',    prob:0.13, label:'🦍 大ゴリラが出た！'},
  {id:'dragon',     prob:0.07, label:'🐉 ドラゴンが出た！'},
  {id:'twindragon', prob:0.05, label:'🐉🐉 双ドラゴンが出た！'},
];
function rollMBPrize() {
  let r = Math.random();
  for (const p of MB_PRIZES) { r -= p.prob; if (r <= 0) return p; }
  return MB_PRIZES[0];
}
function spawnMonsterBall() {
  const fromRight = Math.random() < 0.5;
  monsterBall = {
    x: fromRight ? W + 20 : -20,
    y: GROUND - 160,
    vx: fromRight ? -4.5 : 4.5,
    vy: -4,
    phase: 'flying',
    bounces: 0,
    t: 0,
  };
}
function updateMonsterBall(p1, p2) {
  if (!monsterBall) {
    if (--mbBallTimer <= 0) spawnMonsterBall();
    return;
  }
  const mb = monsterBall;
  mb.t++;

  if (mb.phase === 'flying') {
    mb.vy += 0.38;
    mb.x += mb.vx;
    mb.y += mb.vy;
    if (mb.x < -60 || mb.x > W + 60) { monsterBall = null; mbBallTimer = 60 * 15; return; }
    if (mb.y >= GROUND) {
      mb.y = GROUND;
      mb.bounces++;
      mb.vy = -Math.abs(mb.vy) * 0.45;
      mb.vx *= 0.75;
      if (Math.abs(mb.vy) < 1.2 || mb.bounces >= 3) {
        mb.phase = 'grounded'; mb.vy = 0; mb.vx = 0;
      }
    }
  }

  // 拾う判定（地面待機中は広め、飛行中は小さめ）
  const pickR = mb.phase === 'grounded' ? 44 : 26;
  for (const p of [p1, p2]) {
    const dx = mb.x - p.x, dy = mb.y - (p.y - 40);
    if (Math.sqrt(dx*dx + dy*dy) < pickR) {
      const prize = rollMBPrize();
      const opp = p === p1 ? p2 : p1;
      activateMBPrize(prize, p, opp);
      mbBanner = {text: prize.label, t: 160};
      monsterBall = null; mbBallTimer = 60 * 15;

function spawnMasterBall() {

function updateMasterBall(p1, p2) {

  }
  const mb = masterBall;
  mb.t++;
  if (mb.phase === 'flying') {
    mb.vy += 0.38; mb.x += mb.vx; mb.y += mb.vy;
    if (mb.x < -60 || mb.x > W + 60) { masterBall = null; mballTimer = 60 * 20; return; }
    if (mb.y >= GROUND) {
      mb.y = GROUND; mb.bounces++;
      mb.vy = -Math.abs(mb.vy) * 0.45; mb.vx *= 0.75;
      if (Math.abs(mb.vy) < 1.2 || mb.bounces >= 3) {
        mb.phase = 'grounded'; mb.vy = 0; mb.vx = 0;
      }
    }
  }
  const pickR = mb.phase === 'grounded' ? 44 : 26;
  for (const p of [p1, p2]) {
    const dx = mb.x - p.x, dy = mb.y - (p.y - 40);
    if (Math.sqrt(dx*dx + dy*dy) < pickR) {
      mballPower = {owner: p, t: 600, punchCooldown: 0};
      masterBall = null; mballTimer = 60 * 20;
      beep(880,'sine',0.35,0.08);
      setTimeout(()=>beep(1100,'sine',0.25,0.1),60);
      setTimeout(()=>beep(1320,'sine',0.2,0.12),130);
      return;
    }
  }

class UnchiEffect {
  constructor(owner, target) {
    this.owner=owner; this.target=target;
    this.x=owner.x+owner.dir*30; this.y=owner.y-80;
    this.vx=owner.dir*5.5; this.vy=-8;
    this.t=240; this.hit=false;
    this.cloudTimer=0;
    this.clouds=[]; // {x,y,r,maxR,t,maxT,damaged}
  }
  update(p1, p2) {
    if (this.hit||--this.t<=0) return true;

    // 物理
    this.vy+=0.40;
    this.x+=this.vx;
    this.y+=this.vy;
    if (this.x<30){this.x=30;this.vx=Math.abs(this.vx)*0.65;}
    if (this.x>W-30){this.x=W-30;this.vx=-Math.abs(this.vx)*0.65;}

    // 臭い雲の更新とダメージ
    for (let i=this.clouds.length-1;i>=0;i--) {
      const c=this.clouds[i];
      c.t--;
      c.r=Math.min(c.r+2.8, c.maxR);
      if (c.t<=0){this.clouds.splice(i,1);continue;}
      // 雲が広がったタイミングで1回ダメージ
      if (!c.damaged && c.r>=c.maxR*0.55) {
        c.damaged=true;
        for (const p of [p1,p2]) {
          if (p===this.owner) continue;
          const dx=c.x-p.x, dy=c.y-(p.y-65);
          if (Math.sqrt(dx*dx+dy*dy)<c.r+18) {
            p.takeHit({dmg:4,stun:14,push:5,type:'special'}, p.x<c.x?-1:1);
          }
        }
      }
    }

    // 臭い雲を8フレームごとに生成
    if (++this.cloudTimer>=8) {
      this.cloudTimer=0;
      this.clouds.push({x:this.x,y:this.y,r:12,maxR:88,t:32,maxT:32,damaged:false});
      beep(75+Math.random()*35,'sawtooth',0.07,0.18);
    }

    // 直撃ダメージ
    const opp=this.target;
    const dx=this.x-opp.x, dy=this.y-(opp.y-65);
    if (Math.sqrt(dx*dx+dy*dy)<30) {
      opp.takeHit({dmg:22,stun:30,push:20,type:'special'}, opp.x<this.x?-1:1);
      spawnHit(this.x,this.y);
      beep(90,'sawtooth',0.3,0.45);
      this.hit=true; return true;
    }
    if (this.y>GROUND+40) return true;
    return false;
  }
  draw() {
    // 臭い雲（本体より先に描く）
    this.clouds.forEach(c => {
      ctx.save();
      ctx.globalAlpha=Math.max(0, 0.38*(c.t/c.maxT));
      const g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r);
      g.addColorStop(0,'rgba(150,230,60,0.7)');
      g.addColorStop(1,'rgba(80,180,20,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
    if (this.t<=0||this.hit) return;
    ctx.save(); ctx.translate(this.x,this.y);
    ctx.rotate(Date.now()/170);
    ctx.fillStyle='#7a4a00'; ctx.beginPath(); ctx.ellipse(0,0,16,12,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#8b5a00'; ctx.beginPath(); ctx.ellipse(2,-11,11,9,-0.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#9b6a00'; ctx.beginPath(); ctx.ellipse(0,-19,8,7,0,0,Math.PI*2); ctx.fill();
    // 臭い線3本
    ctx.strokeStyle='rgba(130,230,55,0.65)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(-8,-26); ctx.quadraticCurveTo(-16,-42,-8,-54); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-26); ctx.quadraticCurveTo(4,-44,0,-56); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8,-26); ctx.quadraticCurveTo(16,-42,8,-54); ctx.stroke();
    ctx.restore();
  }
}

class Fighter {

    this.state='idle'; this.st=0;

  hurtbox() {

    if (this.state==='crouch') return {x:this.x-24*s,y:this.y-82*s,w:48*s,h:82*s};
    return {x:this.x-28*s,y:this.y-125*s,w:56*s,h:125*s};

      return {x:this.x+d*8,y:this.y-88*s,w:d*95*s,h:58*s};

      return {x:this.x-55*s,y:this.y-80*s,w:110*s,h:80*s};
    if (this.state==='super'&&def.id==='soyo')
      return {x:this.x+this.dir*4*s,y:this.y-128*s,w:this.dir*52*s,h:128*s};
    if (this.state==='special'&&def.id==='luigi'&&this.superPhase===1)
      return {x:this.x+d*4*s,y:this.y-118*s,w:d*50*s,h:118*s};
    if (this.state==='super'&&def.id==='luigi'&&this.superPhase===1)
      return {x:this.x+d*4*s,y:this.y-118*s,w:d*58*s,h:118*s};
    if (this.state==='punch'&&!def.punchIsProjectile&&this.st>=def.punchS&&this.st<=def.punchE)
      return {x:this.x+d*14*s,y:this.y-92*s,w:d*40*s*rb,h:50*s};
