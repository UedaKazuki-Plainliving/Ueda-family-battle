      return {x:this.x+d*14*s,y:this.y-62*s,w:d*88*s*rb,h:32*s};
    if (this.state==='jatk'&&this.st>=def.jatkS&&this.st<=def.jatkE)
      return {x:this.x+d*5*s,y:this.y-120*s,w:d*55*s*rb,h:Math.max(120*s,GROUND-this.y+30*s)};
    if (this.state==='jkick'&&this.st>=def.kickS&&this.st<=def.kickE)
      return {x:this.x+d*8*s,y:this.y-70*s,w:d*70*s*rb,h:Math.max(70*s,GROUND-this.y+20*s)};
    return null;
  }
  damageInfo() {
    const def=this.def;
    let info=null;
    if (this.state==='super'&&def.id==='yuuri'&&this.superPhase===1) info={dmg:46,stun:55,push:12,type:'special',knockdown:true};
    else if (this.state==='super'&&def.id==='soyo') info={dmg:26,stun:50,push:20,type:'special'};
    else if (this.state==='special'&&def.id==='yuuri') info={dmg:28,stun:38,push:55,type:'special'};
    else if (this.state==='special'&&def.id==='luigi'&&this.superPhase===1) info={dmg:14,stun:22,push:28,type:'special'};
    else if (this.state==='super'&&def.id==='luigi'&&this.superPhase===1) info={dmg:24,stun:36,push:36,type:'special'};
    else if (this.state==='punch') info={dmg:def.punchDmg,stun:def.hitStunGiven,push:def.pushback,type:'punch'};
    else if (this.state==='kick')  info={dmg:def.kickDmg, stun:def.hitStunGiven,push:def.pushback,type:'kick'};
    else if (this.state==='jatk')  info={dmg:def.jatkDmg, stun:def.hitStunGiven,push:def.pushback,type:'jatk'};
    else if (this.state==='jkick') info={dmg:def.kickDmg, stun:def.hitStunGiven,push:def.pushback,type:'jkick'};
    if (!info) return null;
    if (this.dmgDebuff>0) info={...info,dmg:Math.floor(info.dmg*0.55)};
    if (this.bigLightT>0) info={...info,dmg:info.dmg*2};
    if (this.buffFrames>0&&(info.type==='punch'||info.type==='jatk')) info={...info,dmg:Math.round(info.dmg*1.6),stun:info.stun+4,push:info.push+8};
    return info;
  }
  takeHit(info,fromDir) {
    if (this.state==='special'||this.state==='super') return false;
    if (this.state==='down'||this.state==='downrise') return false;
    if (this.invincFrames>0) return false;
    if (this.hitStun>0||this.state==='dead') return false;
    const type=info.type||'normal';
    const facing=this.dir!==fromDir;
    const standG=this.state==='block'&&facing;
    const crouchG=this.guardMode&&this.state==='crouch'&&facing;
    if (type!=='special') this.specialGauge=Math.min(this.maxSpecialGauge,this.specialGauge+11);
    if ((standG&&(type==='punch'||type==='jatk'))||(crouchG&&(type==='kick'))) {

      if (nearWall) {
        const attacker=typeof fighters!=='undefined'&&(fighters[0]===this?fighters[1]:fighters[0]);
        if (attacker) attacker.x-=attacker.dir*40;

        this.x+=fromDir*px;

      else {this.state='down';this.st=0;}
      this.hitStun=0;
      applyPushback(push);
      return true;

    this.hp-=info.dmg; this.hitStun=info.stun;
    this.state='hurt'; this.st=0;

    return true;
  }

            spawnHit(opp.x,opp.y-60,true); spawnHit(opp.x,opp.y-30,true); spawnHit(opp.x,opp.y-90,true);
            for(let k=0;k<3;k++) setTimeout(()=>beep(320-k*70,'sawtooth',0.18,0.42),k*70);
            if (Math.abs(opp.x-this.x)<170) opp.takeHit({dmg:40,stun:50,push:42,type:'special',knockdown:true}, this.dir);
          }
          if (this.st>=52){this.state='idle';this.st=0;this.superPhase=0;}
        }
      } else if (id==='tanjiro') {
        // 火車: ゆっくり飛びかかって斬り→10秒燃焼
        if (this.superPhase===0) {
          this.dir=opp.x>this.x?1:-1;
          const tx=Math.max(45,Math.min(W-45, opp.x - this.dir*44));
          const dx=tx-this.x;
          this.x+=Math.sign(dx)*Math.min(Math.abs(dx),5);
          this.y=GROUND - Math.sin(Math.min(1,this.st/34)*Math.PI)*95;
          if ((Math.abs(dx)<=5 && this.st>=18) || this.st>=70) {
            this.x=tx; this.y=GROUND; this.onGround=true; this.superPhase=1; this.st=0; this.atkHit=false;
          }
        } else {
          if (!this.atkHit) {
            this.atkHit=true;
            spawnHit(opp.x,opp.y-60,true); spawnHit(opp.x,opp.y-30,true);
            for(let k=0;k<2;k++) setTimeout(()=>beep(300-k*80,'sawtooth',0.16,0.4),k*70);
            if (Math.abs(opp.x-this.x)<150) { opp.takeHit({dmg:22,stun:28,push:22,type:'special'}, this.dir); opp.burnFrames=600; }
          }
          if (this.st>=30){this.state='idle';this.st=0;this.superPhase=0;}
        }
      } else if (id==='akaza') {
        // スーパーパンチ: 相手を止めて10連打
        if (this.superPhase===0) {
          this.dir=opp.x>this.x?1:-1;
          opp.frozenFrames=Math.max(opp.frozenFrames,140);
          this.x=Math.max(45,Math.min(W-45, opp.x - this.dir*42));
          this.superHitActive=0; this.superPhase=1; beep(120,'square',0.18,0.4);
        } else {
          opp.frozenFrames=Math.max(opp.frozenFrames,10);
          if (this.st%6===0 && this.superHitActive<10) {
            this.superHitActive++;
            const last=this.superHitActive>=10;
            spawnHit(opp.x,opp.y-55,last);
            beep(280+this.superHitActive*25,'square',0.06,0.2);
            opp.hitStun=0; opp.invincFrames=0;
            opp.takeHit({dmg:last?18:6, stun:8, push:last?46:0, type:'special', knockdown:last}, this.dir);
          }
          if (this.superHitActive>=10 && this.st>=72){this.state='idle';this.st=0;this.superPhase=0;}
        }
      } else if (id==='icchi') {
        // 隕石: ランダムな場所に小隕石を10個落とす
        if (this.st>0 && this.st<=90 && this.st%9===0) spawnMeteor(this, 60+gameRand()*(W-120));
        if (this.st>=120){this.state='idle';this.st=0;}
      } else if (id==='otousan') {
        // 水の玉: 20秒追尾→当たると5秒閉じ込め
        if (this.st===8 && !this.superFired){ this.superFired=true; spawnWaterBall(this); }
        if (this.st>=30){this.state='idle';this.st=0;}
      } else {
        // (未使用) エンティティ召喚
        if (!this.superFired&&this.st===1){
          this.superFired=true;
          if (id==='icchi') activeDragon=new IceDragon(this,opp);
          else if (id==='otousan') activeBlackHole=new BlackHole(this,opp);
        }
        if (this.st>=(id==='icchi'?22:18)){this.state='idle';this.st=0;}
      }
      if (this.hitStun===0) this.dir=opp.x>this.x?1:-1;
      return;
    }

    if (this.state==='special') {
      const id=this.def.id;
      if (id==='yuuri') {
        this.x+=this.specialVx; this.vy+=this.def.gravity*0.65; this.y+=this.vy;
        if (this.y>=GROUND){this.y=GROUND;this.vy=0;this.onGround=true;this.state='idle';this.st=0;}
        this.x=Math.max(40,Math.min(W-40,this.x));
        if (this.x<=41||this.x>=W-41){this.state='idle';this.st=0;}
      } else if (id==='kuppa') {
        // のしかかり
        if (this.superPhase===0) {
          this.vy+=this.def.gravity; this.y+=this.vy;
          const dx=opp.x-this.x;
          if (Math.abs(dx)>8) this.x+=Math.sign(dx)*10;
          this.x=Math.max(40,Math.min(W-40,this.x));
          if (this.y>=GROUND) {
            this.y=GROUND; this.vy=0; this.onGround=true;
            if (Math.abs(this.x-opp.x)<80) {
              this.superPhase=1; this.superHitActive=0;
              beep(100,'sawtooth',0.35,0.5); spawnHit(opp.x,opp.y-50,true);
            } else {this.state='idle';this.st=0;this.superPhase=0;}
          }
        } else {
          this.x=Math.max(40,Math.min(W-40,opp.x));
          this.y=GROUND; this.onGround=true;
          this.superHitActive++;
          if (this.superHitActive%35===0) {
            if (opp.takeHit({dmg:6,stun:8,push:0,type:'special'},(this.x<=opp.x)?1:-1)) {
              spawnHit(opp.x,opp.y-50);
              beep(150,'square',0.12,0.2);
            }
          }
          if (opp.y<GROUND-5||this.superHitActive>=180) {this.state='idle';this.st=0;this.superPhase=0;}
        }
      } else if (id==='kinopio') {
        // キノコ飛ばし 8本
        if (this.st>0&&this.st<=60&&this.st%8===0) spawnMushroom(this);
        if (this.st>=68){this.state='idle';this.st=0;}
      } else if (id==='mario') {
        // ファイヤーボール 5発
        if (this.st%10===1&&this.st<=50) spawnFireball(this);
        if (this.st>=60){this.state='idle';this.st=0;}
      } else if (id==='luigi') {
        // 突進: フェーズ0=溜め、フェーズ1=ダッシュ
        if (this.superPhase===0) {
          if (this.st>=18){this.superPhase=1;beep(440,'sawtooth',0.12,0.2);}
        } else {
          this.x+=this.dir*8;
          this.x=Math.max(40,Math.min(W-40,this.x));
          if (this.x<=41||this.x>=W-41||this.st>=62){this.state='idle';this.st=0;this.superPhase=0;}
        }
      } else if (id==='pikachu') {
        // でんき5連射
        if (this.st>0&&this.st<=40&&this.st%8===0) spawnThunderbolt(this);
        if (this.st>=52){this.state='idle';this.st=0;}
      } else if (id==='kirby') {
        // すいこみ: 相手を引き寄せ、近ければダメージ
        const sucdist=Math.abs(opp.x-this.x);
        if (this.st<55&&sucdist<210&&!opp.hitStun&&!opp.frozenFrames&&opp.state!=='special'&&opp.state!=='super') {
          opp.x+=(this.x-opp.x)*0.055;
        }
        if (this.st===52) {
          const d2=Math.abs(opp.x-this.x);
          if (d2<95) {
            if (opp.takeHit({dmg:16,stun:28,push:0,type:'special'},opp.x>=this.x?1:-1)) spawnHit(opp.x,opp.y-60);
          }
        }
        if (this.st>=68){this.state='idle';this.st=0;}
      } else if (id==='doraemon') {
        // 空気砲: 10秒間連射
        if (this.st>0&&this.st<=600&&this.st%15===0) {
          spawnAirgun(this);
        }
        if (this.st>=608){this.state='idle';this.st=0;}
      } else if (id==='jogo') {
        // ファイヤーボール連射: 2秒間
        if (this.st>0&&this.st<=120&&this.st%15===0) spawnFireball(this);
        if (this.st>=128){this.state='idle';this.st=0;}
      } else if (id==='gojo') {
        // 術式順転「蒼」: 自分の周囲の青い玉が引き寄せてダメージ
        if (this.st===1) beep(350,'sine',0.14,0.45);
        const gojoD=Math.abs(opp.x-this.x);
        if (gojoD<200&&this.st>0&&this.st<=90) {
          if (!opp.frozenFrames&&!opp.hitStun&&opp.state!=='special'&&opp.state!=='super') {
            opp.x+=(this.x-opp.x)*0.035;
          }
          if (this.st%10===5) {
            if (opp.takeHit({dmg:6,stun:8,push:0,type:'special'},opp.x>=this.x?1:-1)) {
              spawnHit(opp.x,opp.y-50);
              beep(500,'sine',0.04,0.1);
            }
          }
        }
        if (this.st>=98){this.state='idle';this.st=0;}
      } else if (id==='zenitsu') {
        // 霹靂一閃: 前方へ瞬間移動して斬る。止まったらダメージ
        if (this.superPhase===0) {
          const step=32, dx=this.zTargetX-this.x;
          if (Math.abs(dx)<=step) {
            this.x=this.zTargetX; this.superPhase=1; this.st=0;
            if (!this.atkHit&&Math.abs(opp.x-this.x)<115) {
              this.atkHit=true;
              if (opp.takeHit({dmg:18,stun:28,push:32,type:'special'}, this.dir)) spawnHit(opp.x,opp.y-60,true);
              beep(900,'sawtooth',0.1,0.32); setTimeout(()=>beep(1500,'square',0.08,0.25),40);
            }
          } else this.x+=Math.sign(dx)*step;
          this.x=Math.max(45,Math.min(W-45,this.x));
        } else {
          if (this.st>=10){this.state='idle';this.st=0;this.superPhase=0;}
        }
      } else if (id==='rengoku') {
        // 炎の呼吸 伍ノ型 炎虎: 炎の虎が突進
        if (this.st===6&&!this.specialFired){ this.specialFired=true; spawnFlameTiger(this,opp); }
        if (this.st>=40){this.state='idle';this.st=0;}
      } else if (id==='tanjiro') {
        // 円舞: 周囲に炎を回し、近づいた相手にダメージ
        if (this.st===1) beep(300,'sawtooth',0.14,0.4);
        if (this.st>0&&this.st<=96 && Math.abs(opp.x-this.x)<88 && this.st%12===0) {
          if (opp.takeHit({dmg:7,stun:12,push:16,type:'special'}, opp.x>=this.x?1:-1)) { spawnHit(opp.x,opp.y-50); beep(440,'sawtooth',0.06,0.15); }
        }
        if (this.st>=100){this.state='idle';this.st=0;}
      } else if (id==='akaza') {
        // 破壊殺・羅針: パンチ/速度/ジャンプ 強化（約7秒）
        if (this.st===1){ this.buffFrames=420; beep(150,'square',0.2,0.4); setTimeout(()=>beep(300,'square',0.14,0.3),90); }
        if (this.st>=24){this.state='idle';this.st=0;}
      } else if (id==='otousan') {
        // 津波: 水の杖から津波を出す
        if (this.st===12) spawnTsunami(this);
        if (this.st>=54){this.state='idle';this.st=0;}
      } else {
        const fireFrame={'icchi':9,'soyo':8,'otousan':15,'okaasan':10}[id]??9;
        const endFrame={'icchi':26,'soyo':28,'otousan':60,'okaasan':30}[id]??26;
        if (id==='otousan') {
          // 3連続ことば: fireFrame, fireFrame+15, fireFrame+30
          if ((this.st===fireFrame||this.st===fireFrame+15||this.st===fireFrame+30)&&!this.specialFired) {
            this.specialFired=true;
          }
        } else {
          if (this.st===fireFrame&&!this.specialFired){this.specialFired=true;}
        }
        if (this.st>=endFrame){this.state='idle';this.st=0;}
      }
      if (this.hitStun===0) this.dir=opp.x>this.x?1:-1;
      return;
    }

    if (!this.onGround) {
      this.vy+=this.def.gravity; this.y+=this.vy;
      // 空中横移動: キー入力で上書き、なければジャンプ時の初速を維持
      if (inp.left) this.airVx=-this.def.walkSpd*0.9;
      else if (inp.right) this.airVx=this.def.walkSpd*0.9;
      this.x+=this.airVx;
      if (this.y>=GROUND){this.y=GROUND;this.vy=0;this.onGround=true;this.airVx=0;
        if (this.state==='jump'||this.state==='jatk'||this.state==='jkick'){this.state='idle';this.st=0;}}
    }
    const atk=['punch','kick','jatk','jkick'].includes(this.state);
    if (this.hitStun===0&&!atk) this.dir=opp.x>this.x?1:-1;
    if (this.hitStun>0) return;

    if (atk) {
      const def=this.def;
      const dur=this.state==='punch'?def.punchDur:(this.state==='kick'||this.state==='jkick')?def.kickDur:def.jatkDur;
      if (this.state==='punch'&&def.punchIsProjectile&&this.st===def.punchS&&!this.punchFired) this.punchFired=true;
      if (this.st>=dur){this.state=this.onGround?'idle':'jump';this.st=0;this.atkHit=false;}
      return;
    }
    if (this.state==='hurt'&&this.st>=this.def.hitStunGiven){this.state='idle';this.st=0;}

    const ok=this.blockStun===0;

    if (ok&&inp.special&&this.specialGauge>=Math.floor(this.maxSpecialGauge/2)&&this.onGround) {
      if (this.specialGauge>=this.maxSpecialGauge) {
        // 超必殺技
        this.state='super';this.st=0;this.superFired=false;this.atkHit=false;this.specialGauge=0;
        if (this.def.id==='yuuri'){this.vy=-26;this.onGround=false;this.superPhase=0;this.airVx=0;}
        else if (this.def.id==='soyo'){this.superPhase=0;this.superTargetX=this.dir>0?W-55:55;this.superOriginX=this.dir>0?55:W-55;this.superHitActive=0;this.atkHit=false;}
        else if (this.def.id==='kuppa'){this.superPhase=0;this.superHitActive=0;}
        else if (this.def.id==='luigi'||this.def.id==='kirby'){this.superPhase=0;}
        else if (this.def.id==='zenitsu'){this.superPhase=0;this.atkHit=false;this.dir=opp.x>this.x?1:-1;}
        else if (this.def.id==='rengoku'){this.superPhase=0;this.superFired=false;this.dir=opp.x>this.x?1:-1;}
        else if (this.def.id==='tanjiro'){this.superPhase=0;this.atkHit=false;this.dir=opp.x>this.x?1:-1;}
        else if (this.def.id==='akaza'){this.superPhase=0;this.superHitActive=0;this.dir=opp.x>this.x?1:-1;}
        triggerSuperFlash(this.def, this.x, this.y);
      } else {
        // 通常必殺技（ゲージ1/2消費）
        this.state='special';this.st=0;this.specialFired=false;this.punchFired=false;
        this.specialGauge=Math.max(0,this.specialGauge-Math.floor(this.maxSpecialGauge/2));
        if (this.def.id==='yuuri'){this.specialVx=this.dir*14;this.vy=-8;this.onGround=false;}
        else if (this.def.id==='kuppa'){this.superPhase=0;this.vy=-20;this.onGround=false;}
        else if (this.def.id==='luigi'){this.superPhase=0;}
        else if (this.def.id==='zenitsu'){this.superPhase=0;this.atkHit=false;this.dir=opp.x>this.x?1:-1;this.zTargetX=Math.max(45,Math.min(W-45, opp.x - this.dir*55));}
        triggerSpecialFlash(this.def);
      }
      return;
    }

    if (ok&&inp.block&&!inp.down&&this.onGround){this.state='block';beep(160,'triangle',0.06,0.1);}
    else if (ok&&inp.punch&&this.onGround){this.state='punch';this.st=0;this.atkHit=false;this.punchFired=false;beep(500,'sawtooth',0.07,0.09);}
    else if (ok&&inp.kick&&this.onGround){this.state='kick';this.st=0;this.atkHit=false;beep(120,'square',0.12,0.15);}
    else if (ok&&inp.punch&&!this.onGround){this.state='jatk';this.st=0;this.atkHit=false;beep(400,'triangle',0.06,0.09);}
    else if (ok&&inp.kick&&!this.onGround&&this.state!=='jkick'){this.state='jkick';this.st=0;this.atkHit=false;beep(120,'square',0.1,0.13);}
    else if (ok&&inp.up&&this.onGround){
      this.vy=this.def.jumpVel*(this.buffFrames>0?1.18:1);this.onGround=false;this.state='jump';this.st=0;
      this.airVx=(inp.right?this.def.walkSpd*1.4:inp.left?-this.def.walkSpd*1.4:0)*(this.buffFrames>0?1.4:1);
      beep(440,'sine',0.1,0.12);
    }
    else if (inp.down&&this.onGround){this.state='crouch';}
    else if (inp.left&&this.onGround){this.x-=this.def.walkSpd*(this.buffFrames>0?1.4:1);this.state='walk';this.comboCount=0;}
    else if (inp.right&&this.onGround){this.x+=this.def.walkSpd*(this.buffFrames>0?1.4:1);this.state='walk';this.comboCount=0;}
    else if (this.onGround&&this.state!=='block'){this.state='idle';this.comboCount=0;}

    this.x=Math.max(55,Math.min(W-55,this.x));
    // 自分が空中、または相手が十分浮いている（足が50px以上）場合は押し分けなし → 裏回り可能
    if (this.onGround && opp.y >= GROUND - 50) {
      const MIN_DIST=54;
      if (Math.abs(this.x-opp.x)<MIN_DIST) {
        this.x = opp.x + (this.x>=opp.x ? MIN_DIST : -MIN_DIST);
      }
    }
  }

  draw() {
    // ダウン状態: 横に倒れる
    if (this.state==='down'||this.state==='downrise') {
      const blink=this.state==='downrise'&&Math.floor(this.st/4)%2===0;
      if (!blink) {
        ctx.save(); ctx.translate(this.x,this.y-10);
        ctx.rotate(this.dir*Math.PI/2);
        ctx.scale(this.def.scale,this.def.scale);
        this._shape(); ctx.restore();
      }
      ctx.fillStyle=this.def.c1; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
      ctx.fillText(this.def.name,this.x,this.y-30); return;
    }
    // --- 超必殺ビジュアル ---
    if (this.state==='super'&&this.def.id==='yuuri') {
      const s=this.def.scale;
      if (this.superPhase===0) {
        const pulse=0.55+0.35*Math.sin(Date.now()/60);
        ctx.save(); ctx.globalAlpha=pulse*0.6; ctx.fillStyle='#ffaa00';
        ctx.shadowBlur=40; ctx.shadowColor='#ffdd00';
        ctx.beginPath(); ctx.arc(this.x,this.y-70*s,55*s,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.restore();
      }
      ctx.save(); ctx.translate(this.x,this.y-35*s);
      if (this.dir===-1) ctx.scale(-1,1); ctx.rotate(-0.42);
      ctx.scale(s,s);
      ctx.strokeStyle=this.superPhase===0?'rgba(255,200,0,0.7)':'rgba(255,160,0,0.85)'; ctx.lineWidth=4;
      for(let i=0;i<8;i++){const ly=-18+i*10;ctx.globalAlpha=(8-i)/8*0.8;
        ctx.beginPath();ctx.moveTo(-100-i*12,ly);ctx.lineTo(-58,ly);ctx.stroke();}
      ctx.globalAlpha=1;
      ctx.restore();
      GFX.shaded(this.x, this.y-35*s, GROUND, s, (g)=>{
        if (this.dir===-1) g.scale(-1,1);
        g.rotate(-0.42); g.scale(s,s);
      }, () => this._shapeDropkick());
      ctx.fillStyle='#ffdd00'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
      ctx.fillText(this.superPhase===0?'↑PHOENIX':this.def.name,this.x,this.y-(158*s)); return;
    }
    if (this.state==='super'&&this.def.id==='soyo') {
      const s=this.def.scale;
      ctx.save();
      // スピードライン（走る方向の逆に尾を引く）
      ctx.globalAlpha=0.6; ctx.strokeStyle='#44ff88'; ctx.lineWidth=3;
      ctx.shadowBlur=10; ctx.shadowColor='#00ff88';
      for(let i=0;i<7;i++){
        const trailX=this.x-this.dir*(30+i*18);
        const dy=-20-i*16;
        ctx.globalAlpha=0.55-i*0.07;
        ctx.beginPath();ctx.moveTo(trailX,this.y+dy);ctx.lineTo(this.x-this.dir*8,this.y+dy);ctx.stroke();
      }
      ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.restore();
      ctx.save(); ctx.translate(this.x,this.y);
      if(this.dir===-1) ctx.scale(-1,1); ctx.scale(s,s);
      this._shape(); ctx.restore(); return;
    }
    if (this.state==='super'&&this.def.id==='icchi') {
      const s=this.def.scale;
      // 赤い空＋振り上げオーラ（隕石発動中）
      ctx.save(); ctx.globalAlpha=0.12+0.06*Math.sin(Date.now()/120); ctx.fillStyle='#ff3300';
      ctx.fillRect(0,0,W,GROUND); ctx.globalAlpha=1; ctx.restore();
      ctx.save(); ctx.globalAlpha=0.4+0.3*Math.sin(Date.now()/60); ctx.fillStyle='#ff8800';
      ctx.shadowBlur=30; ctx.shadowColor='#ffaa00';
      ctx.beginPath(); ctx.arc(this.x,this.y-70*s,45*s,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.restore();
      ctx.fillStyle='#ffcc33'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
      ctx.fillText('☄隕石！',this.x,this.y-(150*s));
    }
    if (this.state==='super'&&this.def.id==='otousan') {
      const s=this.def.scale, pulse=0.5+0.35*Math.sin(Date.now()/70);
      ctx.save(); ctx.globalAlpha=pulse*0.5; ctx.fillStyle='#2a7fff';
      ctx.shadowBlur=35; ctx.shadowColor='#66bbff';
      ctx.beginPath(); ctx.arc(this.x,this.y-65*s,52*s,0,Math.PI*2); ctx.fill();

      ctx.shadowBlur=20; ctx.shadowColor='#00ccff';
      ctx.beginPath(); ctx.arc(this.x,this.y-65*sc,50*sc,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.restore();
      ctx.fillStyle='#00ccff'; ctx.font=`bold ${Math.round(11*sc)}px sans-serif`; ctx.textAlign='center';
      ctx.fillText('❄FREEZE❄',this.x,this.y-(138*sc));
    }
    if (this.dmgDebuff>0) {
      ctx.fillStyle='#ff8800'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
      ctx.fillText('⚡弱体',this.x,this.y-(150*this.def.scale));
    }
    // Special gauge ready glow (2-level)
    const _minG=Math.floor(this.maxSpecialGauge/2);
    if (this.specialGauge>=_minG) {
      const sc=this.def.scale, cy=this.y-65*sc, t2=Date.now();
      if (this.specialGauge>=this.maxSpecialGauge) {
        // 超必殺 ready: dramatic aura + dual rings + 8 particles + label
        const pulse=0.5+0.5*Math.sin(t2/90), pulse2=0.5+0.5*Math.sin(t2/55+1.5);
        ctx.save();
        ctx.globalAlpha=pulse*0.52; ctx.fillStyle=this.def.c1;
        ctx.shadowBlur=52; ctx.shadowColor=this.def.c1;
        ctx.beginPath(); ctx.arc(this.x,cy,74*sc,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=pulse2*0.28; ctx.fillStyle='#ffffff'; ctx.shadowColor='#ffffff';
        ctx.beginPath(); ctx.arc(this.x,cy,42*sc,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0; ctx.restore();
        const ra=t2/600;
        ctx.strokeStyle=this.def.c1; ctx.lineWidth=3; ctx.globalAlpha=0.65+0.35*pulse;
        ctx.beginPath();
        for (let i=0;i<12;i++){const a1=ra+i/12*Math.PI*2,a2=ra+(i+0.65)/12*Math.PI*2,r=64*sc;ctx.moveTo(this.x+Math.cos(a1)*r,cy+Math.sin(a1)*r*0.62);ctx.lineTo(this.x+Math.cos(a2)*r,cy+Math.sin(a2)*r*0.62);}
        ctx.stroke();
        const ra2=-t2/380;
        ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.globalAlpha=0.5+0.5*pulse2;
        ctx.beginPath();
        for (let i=0;i<8;i++){const a1=ra2+i/8*Math.PI*2,a2=ra2+(i+0.55)/8*Math.PI*2,r=46*sc;ctx.moveTo(this.x+Math.cos(a1)*r,cy+Math.sin(a1)*r*0.58);ctx.lineTo(this.x+Math.cos(a2)*r,cy+Math.sin(a2)*r*0.58);}
        ctx.stroke();
        for (let i=0;i<8;i++){
          const ang=(t2/360+i/8)*Math.PI*2, r=60*sc;
          ctx.globalAlpha=0.9*(0.5+0.5*Math.sin(t2/75+i*0.8));
          ctx.fillStyle=(i%2===0)?this.def.c1:'#ffffff';
          ctx.beginPath(); ctx.arc(this.x+Math.cos(ang)*r,cy+Math.sin(ang)*r*0.6,5,0,Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha=1;
        const lblA=0.72+0.28*Math.sin(t2/110);
        ctx.globalAlpha=lblA; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
        ctx.strokeStyle='#000'; ctx.lineWidth=3;
        ctx.strokeText('超必殺 READY!',this.x,cy-80*sc);
        ctx.fillStyle='#ffffff'; ctx.fillText('超必殺 READY!',this.x,cy-80*sc);
        ctx.globalAlpha=1;
      } else {
        // 通常必殺 ready: soft pulsing aura only
        const pulse=0.28+0.28*Math.sin(t2/210);
        ctx.save();
        ctx.globalAlpha=pulse; ctx.fillStyle=this.def.c1;
        ctx.shadowBlur=20; ctx.shadowColor=this.def.c1;
        ctx.beginPath(); ctx.arc(this.x,cy,40*sc,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0; ctx.restore();
        ctx.globalAlpha=1;
      }
    }

    // ガードエフェクト (立ち=縦弧、しゃがみ=横型低バリア)
    if (this.guardFlash>0) {
      const gf=this.guardFlash/14;
      const isCG=this.state==='crouch';
      const sc=this.def.scale;
      const gx=this.x+this.dir*34*sc;
      const gy=this.y-(isCG?20:52)*sc;
      const r=(isCG?24:18)*sc;
      ctx.save(); ctx.lineCap='round';
      ctx.shadowBlur=16; ctx.shadowColor='#2244ff';
      ctx.strokeStyle='#4477ff'; ctx.lineWidth=3.5*sc;
      ctx.globalAlpha=gf*0.88;
      if (isCG) {
        ctx.beginPath(); ctx.arc(gx,gy,r,-Math.PI*0.85,Math.PI*0.85); ctx.stroke();
        ctx.lineWidth=2*sc;
        ctx.beginPath(); ctx.arc(gx,gy,r*0.45,-Math.PI*0.7,Math.PI*0.7); ctx.stroke();
        ctx.shadowBlur=0;
        ctx.globalAlpha=gf*0.2; ctx.fillStyle='#7799ff';
        ctx.beginPath(); ctx.arc(gx,gy,r,-Math.PI*0.85,Math.PI*0.85); ctx.closePath(); ctx.fill();
        ctx.globalAlpha=gf*0.9; ctx.fillStyle='#aaccff';
        ctx.font=`bold ${Math.round(10*sc)}px sans-serif`; ctx.textAlign='center';
        ctx.fillText('しゃがみガード',gx,gy+r+13*sc);
      } else {
        ctx.beginPath(); ctx.arc(gx,gy,r,-Math.PI*0.72,Math.PI*0.72); ctx.stroke();
        ctx.lineWidth=2*sc;
        ctx.beginPath(); ctx.arc(gx,gy,r*0.52,-Math.PI*0.55,Math.PI*0.55); ctx.stroke();
        ctx.shadowBlur=0;
        ctx.globalAlpha=gf*0.22; ctx.fillStyle='#7799ff';
        ctx.beginPath(); ctx.arc(gx,gy,r,-Math.PI*0.72,Math.PI*0.72); ctx.closePath(); ctx.fill();
        ctx.globalAlpha=gf*0.85; ctx.fillStyle='#99bbff';
        ctx.font=`bold ${Math.round(11*sc)}px sans-serif`; ctx.textAlign='center';
        ctx.fillText('カン',gx,gy-r-5*sc);
      }
      ctx.globalAlpha=1; ctx.restore();
    }
    const flash=this.hitStun>0&&Math.floor(this.hitStun/3)%2===0;
    if (flash) return;
    const _bls=(this.bigLightT>0)?1.5:1.0;
    GFX.fighter(this, () => this._shape(), this.def.scale*_bls, this.dir===-1);
    if (this.state==='special'||this.state==='super'||Math.abs(this.vx)>7.5) GFX.ghost(this, this.def.c1);
    // Kirby super: draw hammer on top of character
    if (this.state==='super'&&this.def.id==='kirby') {
      const s=this.def.scale;
      const windUp=this.superPhase===0||(this.superPhase===1&&this.st<40);
      if (windUp) {
        const ang=this.dir*(-Math.PI*0.6);
        ctx.save(); ctx.translate(this.x+this.dir*14*s,this.y-90*s);
        ctx.rotate(ang); ctx.scale(s,s);
        ctx.fillStyle='#886633'; ctx.fillRect(-4,0,8,38);
        ctx.fillStyle='#cc7700'; ctx.fillRect(-18,-22,36,24);
        ctx.fillStyle='rgba(255,200,80,0.5)'; ctx.fillRect(-16,-20,34,20);
        ctx.restore();
      }
    }
    ctx.fillStyle=this.def.c1; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
    ctx.fillText(this.def.name,this.x,this.y-130*this.def.scale-5);
  }

  _shape() {
    const ctx = GFX.target;   // GFX の合成バッファへ描く（通常時は本体 ctx と同じ）
    const s=this.state,def=this.def,c1=def.c1,c2=def.c2;
    const bw=def.bodyW,lw=def.limbW;
    const crouching=s==='crouch';
    const swing=s==='walk'?Math.sin(this.af*Math.PI)*14:0;
    const punchOn=s==='punch'&&this.st>=def.punchS&&this.st<=def.punchE&&!def.punchIsProjectile;
    const jatkOn=s==='jatk'&&this.st>=def.jatkS&&this.st<=def.jatkE;
    const kickOn=(s==='kick'&&this.st>=def.kickS&&this.st<=def.kickE)||
                 (s==='jkick'&&this.st>=def.kickS&&this.st<=def.kickE);
    const isSpecial=s==='special';
    const chargeRaise=isSpecial?Math.min(1,this.st/10):0;
    const bodyTop=crouching?-50:-84;
    const bodyH  =crouching?28:48;
    const beltY  =crouching?-30:-44;
    const aY     =bodyTop+10;
    const headCY =crouching?-68:-106;
    const footY  =crouching?-8:-18;
    GFX.bodyCY = bodyTop + bodyH/2;   // 四肢の付け根判定に使う

    ctx.lineWidth=lw; ctx.lineCap='round'; ctx.strokeStyle=c2;
    if (kickOn) {
      // キック3段階モーション
      const kickPhase = this.st - def.kickS;
      const kickRange = def.kickE - def.kickS;
      if (kickPhase < kickRange * 0.36) {
        // 前半: ひざを上げる
        const t = kickPhase / (kickRange * 0.36);
        const kneeRaise = t * 28;
        // 軸足: 少し屈む
        ctx.beginPath(); ctx.moveTo(0,footY+6); ctx.lineTo(-10,-36+4); ctx.stroke();
        // 蹴り足: ひざ高く
        ctx.beginPath(); ctx.moveTo(0,footY+6); ctx.lineTo(16,-26-kneeRaise); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(16,-26-kneeRaise); ctx.lineTo(24,-16-kneeRaise+10); ctx.stroke();
      } else if (kickPhase < kickRange * 0.72) {
        // 中盤: 蹴り出し
        const t = (kickPhase - kickRange*0.36) / (kickRange * 0.36);
        const ext = t;
        ctx.beginPath(); ctx.moveTo(0,footY+4); ctx.lineTo(-8,-36+3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,footY+4); ctx.lineTo(20+ext*22,-26+ext*14); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(20+ext*22,-26+ext*14); ctx.lineTo(42+ext*14,-10+ext*2); ctx.stroke();
        // つま先（小さな線）
        ctx.lineWidth=lw*0.7;
        ctx.beginPath(); ctx.moveTo(42+ext*14,-10+ext*2); ctx.lineTo(50+ext*14,-8+ext*2); ctx.stroke();
        ctx.lineWidth=lw;
      } else {
        // 後半: 足が戻る
        const t = (kickPhase - kickRange*0.72) / (kickRange * 0.28);
        const ret = t;
        ctx.beginPath(); ctx.moveTo(0,footY+2); ctx.lineTo(-9,-36+2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,footY+2); ctx.lineTo(30-ret*20,-14+ret*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(30-ret*20,-14+ret*2); ctx.lineTo(46-ret*28,-8+ret*2); ctx.stroke();
      }
    } else if (crouching) {
      // しゃがみ: 両ひざを外に開く安定姿勢
      ctx.beginPath(); ctx.moveTo(-4,bodyTop+bodyH); ctx.lineTo(-26,-4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(4,bodyTop+bodyH); ctx.lineTo(26,-4); ctx.stroke();
    } else if (s==='jump'||s==='jatk'||s==='jkick') {
      // ジャンプ: 上昇/下降で足の形を変える
      if (this.vy < 0) {
        // 上昇中: ひざを引き上げる（足を畳む）
        ctx.beginPath(); ctx.moveTo(-4,footY); ctx.lineTo(-14,-28); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-14,-28); ctx.lineTo(-10,-16); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(4,footY); ctx.lineTo(14,-28); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(14,-28); ctx.lineTo(10,-16); ctx.stroke();
      } else {
        // 下降中: 足を伸ばして着地準備
        ctx.beginPath(); ctx.moveTo(0,footY); ctx.lineTo(-12,-36); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,footY); ctx.lineTo(12,-36); ctx.stroke();
      }
    } else {
      // 立ち／歩き: 腰・膝・足首の 2 節構造にして、足先を接地させる
      [[-1, -swing], [1, swing]].forEach(([sd, sw2]) => {
        const hipX = sd * 5,               hipY = -40;
        const kneeX = sd * 8 + sw2 * 0.45, kneeY = -24 + Math.abs(sw2) * 0.10;
        const ankX = sd * 10 + sw2 * 0.95, ankY = -5 - Math.max(0, sw2 * sd) * 0.30;
        ctx.beginPath(); ctx.moveTo(hipX, hipY);  ctx.lineTo(kneeX, kneeY); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(kneeX, kneeY); ctx.lineTo(ankX, ankY);  ctx.stroke();
        ctx.fillStyle = c2;                       // 靴
        ctx.beginPath(); ctx.ellipse(ankX + sd * 2.5, ankY + 2.5, lw * 1.05, lw * 0.58, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.28)';       // 靴底
        ctx.beginPath(); ctx.ellipse(ankX + sd * 2.5, ankY + 4.2, lw * 1.0, lw * 0.26, 0, 0, Math.PI * 2); ctx.fill();
      });
    }

    ctx.fillStyle=c1; GFX.torso(ctx,bw,bodyTop,bodyH);
    ctx.fillStyle=c2; ctx.fillRect(-bw/2,beltY,bw,8);
    if (def.id==='otousan') {
      ctx.fillStyle=c1; GFX.torso(ctx,bw,bodyTop,bodyH);
      ctx.fillStyle='#ffffff'; ctx.fillRect(-4,bodyTop+2,8,bodyH-10);
      ctx.fillStyle=c2; ctx.fillRect(-bw/2,beltY,bw,8);
      ctx.fillStyle='#cc2211';
      ctx.beginPath(); ctx.moveTo(-3,bodyTop+4); ctx.lineTo(3,bodyTop+4);
      ctx.lineTo(5,bodyTop+27); ctx.lineTo(8,beltY);
      ctx.lineTo(0,beltY+8); ctx.lineTo(-8,beltY); ctx.lineTo(-5,bodyTop+27);
      ctx.closePath(); ctx.fill();
    }
    if (def.id==='yuuri') {
      ctx.fillStyle='rgba(180,180,180,0.25)';
      ctx.fillRect(-bw/2,bodyTop,bw/2,bodyH);
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.fillRect(-bw/2+2,bodyTop+2,5,bodyH-4); ctx.fillRect(bw/2-7,bodyTop+2,5,bodyH-4);
      ctx.fillStyle='rgba(100,100,100,0.5)'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
      ctx.fillText('ゆ',0,beltY-8);
    }
    if (def.id==='kuppa') {
      // Shell spikes on back
      ctx.fillStyle='#ffeeaa';
      for (let i=0;i<4;i++){const sx=-bw/2+(i+0.5)*bw/4,sy=bodyTop+i*12; ctx.beginPath();ctx.moveTo(sx-5,sy+8);ctx.lineTo(sx,sy-4);ctx.lineTo(sx+5,sy+8);ctx.closePath();ctx.fill();}
    }
    if (def.id==='mario') {
      // Blue overalls straps
      ctx.fillStyle=c2;
      GFX.torso(ctx,bw,bodyTop,bodyH);
      ctx.fillStyle=c1; ctx.fillRect(-bw/2,bodyTop,bw,bodyH*0.38);
      ctx.fillRect(-bw/2,beltY,bw,bodyH-bodyH*0.38-8);
      ctx.fillStyle=c2; ctx.fillRect(-bw/2,beltY,bw,8);
      ctx.fillRect(-6,bodyTop-4,12,bodyH*0.38+4);
    }
    if (def.id==='kinopio') {
      // White vest
      ctx.fillStyle='#ffffff'; ctx.fillRect(-bw/2+2,bodyTop+2,bw-4,bodyH-4);
      ctx.fillStyle=c1; ctx.fillRect(-bw/2,beltY,bw,8);
      ctx.fillStyle='#cc2222'; ctx.beginPath(); ctx.arc(0,bodyTop+bodyH/2,5,0,Math.PI*2); ctx.fill();
    }
    if (def.id==='kirby') {
      // カービィ: 丸い体
      ctx.fillStyle=c1;
      ctx.beginPath(); ctx.ellipse(0,bodyTop+bodyH/2+2,bw/2+8,bodyH/2+12,0,0,Math.PI*2); ctx.fill();
    }

    ctx.lineWidth=lw; ctx.strokeStyle=c1;
    if (punchOn) {
      // パンチ2段階モーション
      const punchPhase = this.st - def.punchS;
      const punchRange = def.punchE - def.punchS;
      const punchHalf = punchRange * 0.5;
      if (punchPhase < punchHalf) {
        // 前半: 腕が勢いよく前に飛び出す（伸びきった状態）
        ctx.beginPath(); ctx.moveTo(bw/2-4,aY); ctx.lineTo(bw/2+50,aY-2); ctx.stroke();
        // ナックル（拳）を描く
        ctx.fillStyle='#FFCC99';
        ctx.beginPath(); ctx.arc(bw/2+50,aY-2,lw*1.0,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#ccaa77'; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.arc(bw/2+50,aY-2,lw*1.0,0,Math.PI*2); ctx.stroke();
        ctx.lineWidth=lw; ctx.strokeStyle=c1;
        // 反対の腕（左腕）: ガードのように顔の前に構える
        ctx.beginPath(); ctx.moveTo(-bw/2+4,aY); ctx.lineTo(-bw/2+16,aY-18); ctx.stroke();
      } else {
        // 後半: 腕が少し引き戻される（フォロースルー）
        const t = (punchPhase - punchHalf) / (punchRange - punchHalf);
        const pullback = t * 10;
        ctx.beginPath(); ctx.moveTo(bw/2-4,aY); ctx.lineTo(bw/2+40-pullback,aY); ctx.stroke();
        ctx.fillStyle='#FFCC99';
        ctx.beginPath(); ctx.arc(bw/2+40-pullback,aY,lw*0.85,0,Math.PI*2); ctx.fill();
        ctx.lineWidth=lw; ctx.strokeStyle=c1;
        ctx.beginPath(); ctx.moveTo(-bw/2+4,aY); ctx.lineTo(-bw/2+16,aY-14); ctx.stroke();
      }
    } else if (def.id==='otousan'&&s==='punch') {
      const windup=Math.min(1,this.st/18);
      ctx.beginPath(); ctx.moveTo(-bw/2+4,aY); ctx.lineTo(-bw/2-20-windup*15,aY-21-windup*10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bw/2-4,aY); ctx.lineTo(bw/2+10,aY+16); ctx.stroke();
    } else if (crouching&&this.guardMode) {
      // しゃがみガード: 両腕をX字に前に構えて低ガード（前腕を太めに）
      ctx.lineWidth=lw*1.3;
      ctx.beginPath(); ctx.moveTo(bw/2-4,aY); ctx.lineTo(2,aY+20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-bw/2+4,aY); ctx.lineTo(bw/2+8,aY+18); ctx.stroke();
      ctx.lineWidth=lw;
      ctx.fillStyle='#FFCC99';
      ctx.beginPath(); ctx.arc(2,aY+20,lw*0.7,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(bw/2+8,aY+18,lw*0.7,0,Math.PI*2); ctx.fill();
    } else if (crouching) {
      // しゃがみ通常: 手を膝の前に持ってくる（ファイティングポーズ）
      ctx.beginPath(); ctx.moveTo(bw/2-4,aY); ctx.lineTo(bw/2+16,aY+16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-bw/2+4,aY); ctx.lineTo(-4,aY+18); ctx.stroke();
      ctx.fillStyle='#FFCC99';
      ctx.beginPath(); ctx.arc(bw/2+16,aY+16,lw*0.65,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-4,aY+18,lw*0.65,0,Math.PI*2); ctx.fill();
    } else if (s==='block') {
      // ブロック: 両腕を頭・顔の前でクロスして構える（ボクシングガード）
      // 右腕: 前腕を太めに描き、顔前でクロス
      ctx.lineWidth=lw*1.4;
      ctx.beginPath(); ctx.moveTo(bw/2-4,aY-4); ctx.lineTo(bw/2-6,aY-26); ctx.stroke();
      // 左腕: 顔の前に交差
      ctx.beginPath(); ctx.moveTo(-bw/2+4,aY); ctx.lineTo(bw/2-2,aY-24); ctx.stroke();
      ctx.lineWidth=lw;
      // 体を少し前傾（頭は_shapeのheadCYで固定なので腕の配置でレイアウト）
      ctx.fillStyle='#FFCC99';
      ctx.beginPath(); ctx.arc(bw/2-6,aY-26,lw*0.8,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(bw/2-2,aY-24,lw*0.8,0,Math.PI*2); ctx.fill();
    } else if (isSpecial&&(def.id==='icchi'||def.id==='soyo'||def.id==='okaasan'||def.id==='otousan'||def.id==='kuppa'||def.id==='kinopio'||def.id==='mario'||def.id==='luigi'||def.id==='pikachu'||def.id==='doraemon'||def.id==='jogo'||def.id==='gojo'||def.id==='zenitsu'||def.id==='rengoku'||def.id==='tanjiro'||def.id==='akaza')) {
      const raise=chargeRaise*28;
      ctx.beginPath(); ctx.moveTo(bw/2-4,aY); ctx.lineTo(bw/2+18,aY-21-raise); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-bw/2+4,aY); ctx.lineTo(-bw/2-18,aY-21-raise); ctx.stroke();
      if (chargeRaise>0.3) {
        ctx.globalAlpha=chargeRaise; ctx.fillStyle=c1;
        ctx.shadowBlur=10; ctx.shadowColor=c1;
        ctx.beginPath(); ctx.arc(bw/2+18,aY-21-raise,5*chargeRaise,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(-bw/2-18,aY-21-raise,5*chargeRaise,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0; ctx.globalAlpha=1;
      }
    } else if (jatkOn) {
      ctx.beginPath(); ctx.moveTo(bw/2-4,aY); ctx.lineTo(bw/2+8,aY-26); ctx.stroke();
      ctx.fillStyle='#FFCC99'; ctx.beginPath(); ctx.arc(bw/2+8,aY-26,lw*0.75,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-bw/2+4,aY); ctx.lineTo(-bw/2-6,aY-23); ctx.stroke();
    } else if (s==='jump'||s==='jkick') {
      // ジャンプ中の腕: 上昇中は広げてバランス、下降中は前に構える
      if (this.vy < 0) {
        // 上昇中: 両腕を広げる（バランスを取るポーズ）
        ctx.beginPath(); ctx.moveTo(bw/2-4,aY); ctx.lineTo(bw/2+22,aY-12); ctx.stroke();

// ---- CPU AI ----
class CPU {
  constructor(me,opp){this.me=me;this.opp=opp;this.timer=0;this.action='idle';}
  update() {
    const diff = typeof cpuDifficulty !== 'undefined' ? cpuDifficulty : 'normal';

    // モンスターボールが地面にあれば拾いに行く
    if (monsterBall && monsterBall.phase === 'grounded' &&
        this.me.onGround && !['punch','kick','special','super','down','hitstun'].includes(this.me.state)) {
      const myDist = Math.abs(this.me.x - monsterBall.x);
      if (myDist > 40) {
        const inp = {punch:false,kick:false,left:false,right:false,up:false,down:false,block:false,special:false};
        inp[monsterBall.x > this.me.x ? 'right' : 'left'] = true;
        return inp;
      }
    }

    const dist=Math.abs(this.me.x-this.opp.x);

    // 弱い: 40%の確率で何もしない
    if (diff === 'weak' && Math.random() < 0.4) {
      return {punch:false,kick:false,left:false,right:false,up:false,down:false,block:false,special:false};
    }

    // 相手がキック攻撃中ならしゃがみガード
    if (diff !== 'weak' && dist < 120) {
      const oppKick = this.opp.state==='kick'||this.opp.state==='jkick';
      const reactProb = diff === 'strong' ? 0.65 : 0.42;
      if (oppKick && Math.random() < reactProb) {
        return {punch:false,kick:false,left:false,right:false,up:false,down:true,block:true,special:false};
      }
    }
    // 強い: 相手が攻撃中なら積極的にガード
    if (diff === 'strong') {
      const oppAtk = ['punch','kick','jatk','jkick','special'].includes(this.opp.state);
      if (oppAtk && dist < 130 && Math.random() < 0.5) {
        const isKick = this.opp.state==='kick'||this.opp.state==='jkick';
        return {punch:false,kick:false,left:false,right:false,up:false,down:isKick,block:true,special:false};
      }
    }

    if (--this.timer<=0) {
      const fast=this.me.def.walkSpd>5;
      // 弱い: 反応が遅い・距離が近い時だけ行動
      if (diff === 'weak') {
        this.timer = 25 + Math.random() * 35;
        const r = Math.random();
        if (dist < 60) this.action = r < 0.6 ? 'punch' : r < 0.8 ? 'back' : 'idle';
        else this.action = r < 0.5 ? 'fwd' : 'idle';
      } else if (diff === 'strong') {
        this.timer = fast ? 5 + Math.random() * 10 : 10 + Math.random() * 18;
        const r = Math.random();
        if (dist < 85)       this.action = r < 0.35 ? 'punch' : r < 0.55 ? 'kick' : r < 0.7 ? 'block' : 'back';
        else if (dist < 200) this.action = r < 0.55 ? 'fwd' : r < 0.75 ? 'punch' : r < 0.85 ? 'jump' : 'idle';
        else                 this.action = r < 0.7 ? 'fwd' : r < 0.85 ? 'jump' : 'idle';
      } else {
        this.timer=fast?8+Math.random()*15:18+Math.random()*28;
        const r=Math.random();
        if (dist<85)       this.action=r<0.35?'punch':r<0.6?'kick':r<0.75?'block':'back';
        else if (dist<170) this.action=r<0.5?'fwd':r<0.7?'punch':r<0.8?'jump':'idle';
        else               this.action=r<0.65?'fwd':r<0.8?'jump':'idle';
      }
    }
    const toward=this.opp.x>this.me.x;
    const inp={punch:false,kick:false,left:false,right:false,up:false,down:false,block:false,special:false};
    const acc=this.me.def.id==='icchi'||this.me.def.id==='soyo'?0.78:0.68;
    if (Math.random()<acc) {
      // 弱い: パンチのみ、キックなし
      if (diff === 'weak') {
        if (this.action==='punch') inp.punch=true;
        else if (this.action==='fwd') inp[toward?'right':'left']=true;
        else if (this.action==='back') inp[toward?'left':'right']=true;
      } else {
        if (this.action==='punch') inp.punch=true;
        else if (this.action==='kick') {
          // 強い: 50%でキック使う
          if (diff === 'strong' && Math.random() < 0.5) inp.kick=true;
          else if (diff !== 'strong') inp.kick=true;
          else inp.punch=true;
        }
        else if (this.action==='fwd') inp[toward?'right':'left']=true;
        else if (this.action==='back') inp[toward?'left':'right']=true;
        else if (this.action==='jump'){inp.up=true;inp[toward?'right':'left']=true;}
        else if (this.action==='block') {
          inp.block=true;
          if (this.opp.state==='kick'||this.opp.state==='jkick'||Math.random()<0.38) inp.down=true;
        }
      }
    }
    // 空中攻撃: 降下中で相手が近ければジャンプ攻撃
    if (diff !== 'weak' && !this.me.onGround && this.me.state==='jump' && this.me.vy>0 && dist<130) {
      Math.random()<0.55 ? (inp.punch=true) : (inp.kick=true);
    }
    // おとうさん: ブラックホール発動中は前進して相手を追い込む
    if (this.me.def.id==='otousan' && typeof activeBlackHole!=='undefined' && activeBlackHole && activeBlackHole.owner===this.me) {
      inp[toward?'right':'left'] = true;
      return inp;
    }
    const full=this.me.specialGauge>=this.me.maxSpecialGauge;
    // 弱い: 必殺技を使わない
    if (diff !== 'weak' && full&&this.me.onGround&&this.me.state==='idle') {
      const useIt=this.me.def.id==='yuuri'?dist<220:true;
      // 強い: より積極的に必殺技を使う
      const threshold = diff === 'strong' ? 0.75 : 0.6;
      if (useIt&&Math.random()<threshold) inp.special=true;
    }
    return inp;
  }
}

// ---- Collision ----
function checkCollision(a,b) {
  if (a.atkHit) return;
  const hb=a.hitbox(); if (!hb) return;
  const hurt=b.hurtbox();
  const hx=hb.w<0?hb.x+hb.w:hb.x, hw=Math.abs(hb.w);
  if (hx<hurt.x+hurt.w&&hx+hw>hurt.x&&hb.y<hurt.y+hurt.h&&hb.y+hb.h>hurt.y) {
    const info=a.damageInfo();
    if (info&&b.takeHit(info,a.dir)) {
      if (a.state!=='special'&&a.state!=='super') a.atkHit=true;
      if (a.state!=='special'&&a.state!=='super') a.specialGauge=Math.min(a.maxSpecialGauge,a.specialGauge+16);
      spawnHit((a.x+b.x)/2,b.y-72,a.state==='special'||a.state==='super');
    }
  }
}

function drawResultPose() {
  if (phase!=='roundend') return;
  [p1,p2].forEach(f => {
    if (f.pose!=='celebrate') return;
    const now=Date.now();
    ctx.save();
    for (let i=0;i<6;i++) {
      const ang=now/500+i*Math.PI/3;
      const r=48+Math.sin(now/300+i)*8;
      const sx=f.x+Math.cos(ang)*r;
      const sy=f.y-160+Math.sin(ang*1.5)*12;
      const sz=3+Math.sin(now/200+i)*1.2;
      ctx.fillStyle=i%3===0?'#ffdd00':i%3===1?'#ffffff':'#ff88cc';
      ctx.beginPath();ctx.arc(sx,sy,sz,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  });
}

    if (!IS_TOUCH) {
      ctx.font='13px sans-serif'; ctx.fillStyle='#666'; ctx.textAlign='center';
      ctx.fillText('↑↓ / W/S で選択  　1:弱い  2:普通  3:強い  　Space / Enter で決定',W/2,440);
    }
    drawBackBtn();
    return;
  }

  const modes=[
    {id:'cpu', label:'1人プレイ（vs CPU）',     sub:'AIと対戦'},
    {id:'2p',  label:'2人プレイ（vs Player）',   sub:'同じ端末で2P対戦'},
    {id:'net', label:'ネット対戦（WiFi）',        sub:'同じWiFiの別端末と対戦'},
  ];
  modes.forEach((m,i)=>{
    const bx=W/2-180, by=130+i*100, bw=360, bh=75;
    const sel=gameMode===m.id;
    ctx.strokeStyle=sel?'#ffdd00':'#555'; ctx.lineWidth=sel?3:1.5;
    ctx.fillStyle=sel?'rgba(255,200,0,0.1)':'rgba(255,255,255,0.03)';
    ctx.fillRect(bx,by,bw,bh); ctx.strokeRect(bx,by,bw,bh);
    ctx.font='bold 20px sans-serif'; ctx.fillStyle=sel?'#ffdd00':'#aaa';
    ctx.fillText(m.label,W/2,by+34);
    ctx.font='13px sans-serif'; ctx.fillStyle='#777';
    ctx.fillText(m.sub,W/2,by+56);
    if (sel) { ctx.fillStyle='#ffdd00'; ctx.font='bold 16px sans-serif'; ctx.fillText('▶',bx+18,by+44); }
  });
  if (!IS_TOUCH) {
    ctx.font='13px sans-serif'; ctx.fillStyle='#666'; ctx.textAlign='center';
    ctx.fillText('↑↓ / W/S で選択  　Space / Enter で決定',W/2,430);
    if (gameMode==='2p') {
      ctx.fillStyle='#555';
      ctx.fillText('P2操作: ←→↑↓  Num1 パンチ  Num2 キック  Num3 ガード  Num0 必殺技',W/2,446);
    }
  }
  drawBackBtn();
}

function drawCharSelect() {
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.font='bold 28px sans-serif'; ctx.textAlign='center';
  ctx.fillStyle='#ffdd00';
  const charTitle = gameMode==='net'
    ? `あなた（P${netPlayerNum||'?'}）のキャラを選択`
    : selectStep===0?'P1: キャラを選択':gameMode==='2p'?'P2: キャラを選択':'対戦相手を選択';
  ctx.fillText(charTitle,W/2,38);
  ctx.font='13px sans-serif'; ctx.fillStyle='#888';
  ctx.fillText(IS_TOUCH ? 'タップして選択 / 決定で確定' : '← → で選択　　Space / Enter で決定',W/2,62);
  drawBackBtn();

  const CS_COLS=9, PW=84, PH=185, GAP=4, startX=6, startY=68;
  CHAR_LIST.forEach((def,idx)=>{
    const col=idx%CS_COLS, row=Math.floor(idx/CS_COLS);
    const px=startX+col*(PW+GAP), py=startY+row*(PH+GAP);
    const isP1=idx===selectedCharIdx;
    const isCPU=idx===cpuCharIdx;
    const isNetOpp=gameMode==='net'&&idx===netOppCharIdx;
    const cursor=gameMode==='net'?isP1:(selectStep===0?isP1:isCPU);
    const locked=gameMode==='net'?(netMyReady&&isP1):(selectStep===1&&isP1);
    const blink=Math.floor(Date.now()/300)%2;
    ctx.strokeStyle=cursor?(blink?'#ffdd00':'#ff8800'):locked?'#00ccee':isNetOpp?'#f66':'#444';
    ctx.lineWidth=cursor?3:locked?2:isNetOpp?2:1.5;
    ctx.fillStyle=cursor?'rgba(255,200,0,0.07)':locked?'rgba(0,180,255,0.05)':isNetOpp?'rgba(255,80,80,0.05)':'rgba(255,255,255,0.02)';
    ctx.fillRect(px,py,PW,PH); ctx.strokeRect(px,py,PW,PH);

    ctx.save(); ctx.translate(px+PW/2, py+108);
    const sc=def.scale*0.64; ctx.scale(sc,sc);
    const dummy=Object.create(Fighter.prototype);
    dummy.def=def; dummy.state='idle'; dummy.st=0;
    dummy.af=Math.floor(Date.now()/200)%2; dummy.atick=0;
    dummy._shape.call(dummy); ctx.restore();

    ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
    ctx.fillStyle=def.c1; ctx.fillText(def.name, px+PW/2, py+140);
    ctx.font='9px sans-serif'; ctx.fillStyle='#ccc';
    ctx.fillText(def.desc, px+PW/2, py+153);
    ctx.font='bold 8px sans-serif'; ctx.fillStyle='#ffaa00';
    ctx.fillText('💥'+def.specialName, px+PW/2, py+164);
    ctx.font='bold 8px sans-serif'; ctx.fillStyle='#cc88ff';
    ctx.fillText('★'+def.superName, px+PW/2, py+175);
    ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
    const labelY=py+15;
    if (gameMode==='net') {
      if (locked){ctx.fillStyle='#00ccee';ctx.fillText(`✓ P${netPlayerNum}`,px+PW/2,labelY);}
      else if (isP1){ctx.fillStyle='#ffdd00';ctx.fillText(`▶ P${netPlayerNum}`,px+PW/2,labelY);}
      else if (isNetOpp){const o=netPlayerNum===1?2:1;ctx.fillStyle='#f88';ctx.fillText(`▶ P${o}`,px+PW/2,labelY);}
      else {ctx.fillStyle='#555';ctx.fillText('',px+PW/2,labelY);}
    } else if (selectStep===0) {
      ctx.fillStyle=isP1?'#ffdd00':'#555';
      ctx.fillText(isP1?'▶ P1':'',px+PW/2,labelY);
    } else {
      if (locked){ctx.fillStyle='#00ccee';ctx.fillText('✓ P1',px+PW/2,labelY);}
      else if (isCPU){ctx.fillStyle='#ffdd00';ctx.fillText(gameMode==='2p'?'▶ P2':'▶ CPU',px+PW/2,labelY);}
      else {ctx.fillStyle='#555';ctx.fillText('',px+PW/2,labelY);}
    }
  });

  if (gameMode==='net'&&netMyReady&&netOppCharIdx===-1) {
    ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
    const dots='.'.repeat(Math.floor(Date.now()/500)%4);
    ctx.font='22px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#aaa';
    ctx.fillText('相手を待っています'+dots,W/2,H/2);
  }
}

// ---- Game State ----
let phase='intro';
let p1,p2,cpuCtrl;
let fighters=[];
let timerSec=99, timerTick=0;
let wins=[0,0], roundNum=1, koGrace=0;
let flash={msg:'',t:0};
let endTimer=0, selectedCharIdx=0, cpuCharIdx=1, selectStep=0;
let gameMode='cpu'; // 'cpu', '2p', or 'net'
let modeSelectStep=0; // 0=モード選択, 1=難易度選択(CPUのみ)
let cpuDifficulty='normal'; // 'weak', 'normal', 'strong'
let netWs=null, netPlayerNum=0, netSeed=0;
let netOppInput={punch:false,kick:false,left:false,right:false,up:false,down:false,block:false,special:false};
let netMyCharIdx=-1, netOppCharIdx=-1, netMyReady=false;
let _syncFrameCount=0;
function showFlash(msg,dur){flash.msg=msg;flash.t=dur;}
function exitToMenu(){
  if(netWs){try{netWs.close();}catch(e){} netWs=null;}
  netPlayerNum=0; netMyCharIdx=-1; netOppCharIdx=-1; netMyReady=false;
  wins=[0,0]; roundNum=1; selectStep=0; modeSelectStep=0;
  phase='modeselect';
  if (IS_TOUCH) resetCanvas();
  try{beep(300,'sine',0.08);}catch(e){}
}

function connectNet() {
  const proto=location.protocol==='https:'?'wss':'ws';
  const url=proto+'://'+location.host;
  try { netWs=new WebSocket(url); } catch(e) { phase='netwait'; return; }
  phase='netwait';
  netWs.onmessage=e=>{ try{handleNetMsg(JSON.parse(e.data));}catch(ex){} };
  netWs.onclose=()=>{
    if(phase==='fight'||phase==='countdown'||phase==='roundend') {
      showFlash('相手が切断しました',200);
      setTimeout(()=>exitToMenu(),3000);
    } else if(phase==='netwait'||phase==='charselect') {
      phase='netwait';
    }
    netWs=null;
  };
  netWs.onerror=()=>{};
}

function handleNetMsg(msg) {
  switch(msg.type) {
    case 'start':
      netPlayerNum=msg.player;
      netMyCharIdx=-1; netOppCharIdx=-1; netMyReady=false;
      phase='charselect'; selectStep=0; selectedCharIdx=0; cpuCharIdx=1;
      beep(440,'sine',0.12);
      break;
    case 'char':
      netOppCharIdx=msg.idx;
      if (msg.seed) netSeed=msg.seed; // player 1's seed is authoritative
      if(netMyReady) startNetFight();
      break;
    case 'input':
      netOppInput={punch:!!msg.punch,kick:!!msg.kick,left:!!msg.left,right:!!msg.right,
                   up:!!msg.up,down:!!msg.down,block:!!msg.block,special:!!msg.special};
      break;
    case 'roundend':
      // Player 1 is authoritative: sync win counts and enter roundend
      wins=msg.wins;
      if (msg.p1wins===true){
        // Player 1 won → Player 2 lost
        p1.pose='celebrate'; p2.pose='defeat';
        showFlash('相手 WIN!',130); beep(330,'sine',0.6,0.35);
      } else if (msg.p1wins===false){
        // Player 2 won → Player 2's character celebrates
        p2.pose='celebrate'; p1.pose='defeat';
        showFlash(`${p2.def.name} WIN!`,130); beep(523,'sine',0.6,0.4);
      } else { showFlash('DRAW!',130); }
      phase='roundend'; endTimer=999999; // wait for nextround message
      break;
    case 'nextround':
      // Player 1 signals it's time to start the next round
      roundNum=msg.roundNum;
      startRound(); phase='countdown';
      showFlash(`ROUND ${roundNum}`,80);
      setTimeout(()=>showFlash('FIGHT!',70),1200);
      setTimeout(()=>{phase='fight';},1800);
      break;
    case 'gameover':
      exitToMenu();
      break;
    case 'disconnect':
      showFlash('相手が切断しました',200);
      setTimeout(()=>exitToMenu(),3000);
      break;
    case 'sync':
      if (netPlayerNum===2&&p1&&p2) {
        if (Math.abs(p1.x-msg.p1x)>20) p1.x=msg.p1x;
        if (Math.abs(p1.y-msg.p1y)>20) p1.y=msg.p1y;
        if (Math.abs(p2.x-msg.p2x)>20) p2.x=msg.p2x;
        if (Math.abs(p2.y-msg.p2y)>20) p2.y=msg.p2y;
        p1.hp=msg.p1hp; p1.specialGauge=msg.p1sg;
        p2.hp=msg.p2hp; p2.specialGauge=msg.p2sg;
      }
      break;
  }
}

function startNetFight() {
  if(netPlayerNum===1){selectedCharIdx=netMyCharIdx;cpuCharIdx=netOppCharIdx;}
  else{selectedCharIdx=netOppCharIdx;cpuCharIdx=netMyCharIdx;}
  seedRng(netSeed||1); // initialize shared PRNG
  wins=[0,0];roundNum=1;startRound();phase='countdown';
  showFlash(`ROUND ${roundNum}`,80);
  setTimeout(()=>showFlash('FIGHT!',70),1200);
  setTimeout(()=>{phase='fight';},1800);
  beep(523,'sine',0.3,0.4);
}

function drawNetWait() {
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.font='bold 32px sans-serif'; ctx.textAlign='center';
  ctx.fillStyle='#ffdd00'; ctx.fillText('ネット対戦（WiFi）',W/2,100);
  if(!netWs||netWs.readyState>1) {
    ctx.font='18px sans-serif'; ctx.fillStyle='#f66';
    ctx.fillText('サーバーに接続できません',W/2,210);
    ctx.font='14px sans-serif'; ctx.fillStyle='#666';
    ctx.fillText('node server.js を起動してから接続してください',W/2,240);
    drawBackBtn(); return;
  }
  const dots='.'.repeat(Math.floor(Date.now()/500)%4);
  ctx.font='22px sans-serif'; ctx.fillStyle='#aaa';
  ctx.fillText('相手プレイヤーを待っています'+dots,W/2,210);
  ctx.font='14px sans-serif'; ctx.fillStyle='#666';
  ctx.fillText('相手も同じURLにアクセスしてください',W/2,245);
  ctx.fillText('（接続: '+location.host+'）',W/2,268);
  drawBackBtn();
}

function startRound() {
  if (typeof GFX!=='undefined') GFX.clearGhosts();
  const p1def=CHAR_LIST[selectedCharIdx];
  p1=new Fighter(200,true,p1def);
  p2=new Fighter(600,false,CHAR_LIST[cpuCharIdx]);
  fighters=[p1,p2];
  cpuCtrl=gameMode==='cpu'?new CPU(p2,p1):null;
  projectiles.length=0; wordProjs.length=0;
  hurdleAttack=null; activeGorilla=null; activeDragon=null; activeBlackHole=null;
  doraemonBig=null; activeVolcano=null;
  monsterBall=null; mbBallTimer=60*15; mbSummons.length=0; mbLightningBolts.length=0; mbBanner=null;
  masterBall=null; mballTimer=60*20; mballPower=null;
  pencils.length=0; pencilSpawnTimer=0;
  initSchoolStage();
  timerSec=99; timerTick=0; koGrace=0;
}

function spawnSpecialEffect(owner, target) {
  switch(owner.def.id) {
    case 'icchi': spawnFireTornado(owner); break;
    case 'soyo':  activateHurdles(owner,target); break;
    case 'otousan': activateWordAttack(owner); break;
    case 'okaasan':
      activeGorilla=new Gorilla(owner,target);
      beep(300,'sawtooth',0.3,0.5); setTimeout(()=>beep(200,'square',0.25,0.4),100);
      break;
  }
}

// ---- Main Loop ----
let _lastLoopTs = 0;
const _FRAME_MS = 1000 / 60;
function loop(ts) {
  requestAnimationFrame(loop);
  GFX.tick(ts);
  if (ts - _lastLoopTs < _FRAME_MS - 1) return; // cap at 60fps on 120Hz displays
  _lastLoopTs = ts;

  if (phase==='intro') {
    drawIntro();
    if (keyOnce('Space')||keyOnce('Enter')){phase='modeselect';beep(440,'sine',0.1);}
    return;
  }
  if (phase==='modeselect') {
    drawModeSelect();
    if (keyOnce('Backspace')||keyOnce('Escape')) {
      if (modeSelectStep===1) { modeSelectStep=0; beep(300,'sine',0.08); }
      else { phase='intro'; beep(300,'sine',0.08); }
      return;
    }
    if (modeSelectStep === 1) {
      // 難易度選択
      const diffs = ['weak','normal','strong'];
      const curIdx = diffs.indexOf(cpuDifficulty);
      if (keyOnce('ArrowUp')||keyOnce('KeyW')) { cpuDifficulty=diffs[Math.max(0,curIdx-1)]; beep(350,'sine',0.08); }
      if (keyOnce('ArrowDown')||keyOnce('KeyS')) { cpuDifficulty=diffs[Math.min(2,curIdx+1)]; beep(350,'sine',0.08); }
      if (keyOnce('Digit1')) { cpuDifficulty='weak'; beep(350,'sine',0.08); }
      if (keyOnce('Digit2')) { cpuDifficulty='normal'; beep(350,'sine',0.08); }
      if (keyOnce('Digit3')) { cpuDifficulty='strong'; beep(350,'sine',0.08); }
      if (keyOnce('Space')||keyOnce('Enter')) {
        modeSelectStep=0; phase='charselect'; selectStep=0; selectedCharIdx=0; cpuCharIdx=1; beep(440,'sine',0.12);
      }
    } else {
      const modeList=['cpu','2p','net'];
      const mi=modeList.indexOf(gameMode);
      if (keyOnce('ArrowUp')||keyOnce('KeyW')) { gameMode=modeList[Math.max(0,mi-1)]; beep(350,'sine',0.08); }
      if (keyOnce('ArrowDown')||keyOnce('KeyS')) { gameMode=modeList[Math.min(2,mi+1)]; beep(350,'sine',0.08); }
      if (keyOnce('Space')||keyOnce('Enter')) {
        if (gameMode==='cpu') { modeSelectStep=1; beep(350,'sine',0.08); }
        else if (gameMode==='2p') { phase='charselect'; selectStep=0; selectedCharIdx=0; cpuCharIdx=1; beep(440,'sine',0.12); }
        else { connectNet(); beep(350,'sine',0.08); }
      }
    }
    return;
  }
  if (phase==='netwait') {
    drawNetWait();
    if (keyOnce('Backspace')||keyOnce('Escape')) {
      if(netWs){try{netWs.close();}catch(e){} netWs=null;}
      phase='modeselect'; beep(300,'sine',0.08);
    }
    return;
  }
  if (phase==='charselect') {
    drawCharSelect();
    if (keyOnce('Backspace')||keyOnce('Escape')) {
      if (gameMode==='net') {
        if(netWs){try{netWs.close();}catch(e){} netWs=null;}
        phase='modeselect'; beep(300,'sine',0.08);
      } else if (selectStep===1) { selectStep=0; beep(300,'sine',0.08); }
      else { modeSelectStep=0; phase='modeselect'; beep(300,'sine',0.08); }
      return;
    }
    if (keyOnce('ArrowLeft')||keyOnce('KeyA')) {
      if (gameMode==='net'||selectStep===0) selectedCharIdx=(selectedCharIdx-1+CHAR_LIST.length)%CHAR_LIST.length;
      else cpuCharIdx=(cpuCharIdx-1+CHAR_LIST.length)%CHAR_LIST.length;
      beep(350,'sine',0.08);
    }
    if (keyOnce('ArrowRight')||keyOnce('KeyD')) {
      if (gameMode==='net'||selectStep===0) selectedCharIdx=(selectedCharIdx+1)%CHAR_LIST.length;
      else cpuCharIdx=(cpuCharIdx+1)%CHAR_LIST.length;
      beep(350,'sine',0.08);
    }
    if (keyOnce('Space')||keyOnce('Enter')||keyOnce('KeyJ')) {
      if (gameMode==='net') {
        if (!netMyReady) {
          netMyCharIdx=selectedCharIdx; netMyReady=true;
          const seedToSend = netPlayerNum===1 ? (netSeed=Date.now()^0xABCD1234) : netSeed;
          if (netWs&&netWs.readyState===1) netWs.send(JSON.stringify({type:'char',idx:selectedCharIdx,seed:seedToSend}));
          beep(440,'sine',0.12);
          if (netOppCharIdx!==-1) startNetFight();
        }
        return;
      }
      if (selectStep===0) {
        selectStep=1; cpuCharIdx=(selectedCharIdx+1)%CHAR_LIST.length;
        beep(440,'sine',0.12);
      } else {
        wins=[0,0];roundNum=1;
        if (gameMode==='2p'&&IS_TOUCH) setup2PTouchCanvas();
        phase='stageselect'; beep(440,'sine',0.12);
      }
    }
    return;
  }
  if (phase==='stageselect') {
    drawStageSelect();
    if (keyOnce('Backspace')||keyOnce('Escape')) {
      selectStep=1; phase='charselect'; beep(300,'sine',0.08); return;
    }
    if (keyOnce('ArrowLeft')||keyOnce('KeyA')) { selectedStage=(selectedStage-1+STAGE_COUNT)%STAGE_COUNT; beep(350,'sine',0.08); }
    if (keyOnce('ArrowRight')||keyOnce('KeyD')) { selectedStage=(selectedStage+1)%STAGE_COUNT; beep(350,'sine',0.08); }
    if (keyOnce('Space')||keyOnce('Enter')||keyOnce('KeyJ')) {
      startRound(); phase='countdown';
      showFlash(`ROUND ${roundNum}`,80);
      setTimeout(()=>showFlash('FIGHT!',70),1200);
      setTimeout(()=>{phase='fight';},1800);
      beep(523,'sine',0.3,0.4);
    }
    return;
  }

  GFX.camBegin();
  drawBackground();
  drawScreenFlash();

  if (phase==='fight') {
    if (++timerTick>=60){timerTick=0;timerSec--;}
    const myInput={punch:keys['KeyJ'],kick:keys['KeyK'],left:keys['KeyA'],right:keys['KeyD'],
                   up:keys['KeyW'],down:keys['KeyS'],block:keys['KeyL'],special:keys['Space']};
    if (gameMode==='net'&&netWs&&netWs.readyState===1) netWs.send(JSON.stringify({type:'input',...myInput}));
    if (gameMode==='net'&&netPlayerNum===1&&netWs&&netWs.readyState===1) {
      if (++_syncFrameCount>=60) {
        _syncFrameCount=0;
        netWs.send(JSON.stringify({type:'sync',
          p1x:Math.round(p1.x),p1y:Math.round(p1.y),p1hp:p1.hp,p1sg:p1.specialGauge,
          p2x:Math.round(p2.x),p2y:Math.round(p2.y),p2hp:p2.hp,p2sg:p2.specialGauge}));
      }
    }
    const i1=gameMode==='net'&&netPlayerNum===2?netOppInput:myInput;
    const i2=gameMode==='2p'
      ?{punch:keys['Numpad1'],kick:keys['Numpad2'],block:keys['Numpad3'],special:keys['Numpad0'],
        left:keys['ArrowLeft'],right:keys['ArrowRight'],up:keys['ArrowUp'],down:keys['ArrowDown']}
      :gameMode==='net'?(netPlayerNum===2?myInput:netOppInput)
      :cpuCtrl.update();
    p1.update(p2,i1); p2.update(p1,i2);

    if (p1.specialFired){p1.specialFired=false;spawnSpecialEffect(p1,p2);}
    if (p2.specialFired){p2.specialFired=false;spawnSpecialEffect(p2,p1);}
    if (p1.punchFired&&p1.def.punchIsProjectile){p1.punchFired=false;if(!projectiles.some(p=>p.owner===p1)){p1.def.id==='kuppa'?spawnFire(p1):spawnBaseball(p1);}}
    if (p2.punchFired&&p2.def.punchIsProjectile){p2.punchFired=false;if(!projectiles.some(p=>p.owner===p2)){p2.def.id==='kuppa'?spawnFire(p2):spawnBaseball(p2);}}

    updateProjectiles(p1,p2);
    updateHurdles(p1,p2);
    updateWords(p1,p2);

    if (activeDragon) activeDragon.update();
    if (activeBlackHole) activeBlackHole.update(p1,p2);

    if (activeGorilla) {
      activeGorilla.update();
      if (activeGorilla&&activeGorilla.t>0&&!activeGorilla.atkHit) {
        const gt=activeGorilla.owner===p1?p2:p1;
        const ghb=activeGorilla.hitbox();
        if (ghb) {
          const hurt=gt.hurtbox();
          const ghx=ghb.w<0?ghb.x+ghb.w:ghb.x, ghw=Math.abs(ghb.w);
          if (ghx<hurt.x+hurt.w&&ghx+ghw>hurt.x&&ghb.y<hurt.y+hurt.h&&ghb.y+ghb.h>hurt.y) {
            if (gt.takeHit({dmg:12,stun:20,push:18,type:'special'},activeGorilla.dir)) {
              activeGorilla.atkHit=true;
              spawnHit((activeGorilla.x+gt.x)/2,gt.y-50);
            }
          }
        }
      }
    }

    checkCollision(p1,p2); checkCollision(p2,p1);
    updateMonsterBall(p1,p2); updateMBSummons(p1,p2); updateMBLightningBolts(p1,p2);
    updateMasterBall(p1,p2); if(mballPower) updateMasterBallPower(p1,p2,i1,i2);
    if (selectedStage===1) updatePencils(p1,p2);
    if (selectedStage===2) updateSchool(p1,p2);

    const p1ko=p1.hp<=0,p2ko=p2.hp<=0,timeout=timerSec<=0;
    if (p1ko||p2ko||timeout) {
      const p1tech=p1.state==='special'||p1.state==='super';
      const p2tech=p2.state==='special'||p2.state==='super';
      const anyEffect=p1tech||p2tech||p1.state==='down'||p2.state==='down'||!!activeBlackHole||!!activeDragon||!!hurdleAttack||projectiles.length>0||wordProjs.length>0;
      if (anyEffect&&koGrace<300) { koGrace++; }
      else {
        koGrace=0;
        let p1wins;
        if (timeout) p1wins=p1.hp>p2.hp?true:p1.hp<p2.hp?false:null;
        else if (p2ko&&!p1ko) p1wins=true;
        else if (p1ko&&!p2ko) p1wins=false;
        else p1wins=null;
        if (p1wins===true){
          wins[0]++;
          p1.pose='celebrate'; p2.pose='defeat';
          const wn=gameMode==='net'&&netPlayerNum===2?'相手':p1.def.name;
          showFlash(`${wn} WIN!`,130);
          beep(gameMode==='net'&&netPlayerNum===2?330:523,'sine',0.6,gameMode==='net'&&netPlayerNum===2?0.35:0.4);
        } else if (p1wins===false){
          wins[1]++;
          p2.pose='celebrate'; p1.pose='defeat';
          const wn=gameMode==='net'&&netPlayerNum===1?'相手':gameMode==='2p'||gameMode==='net'?p2.def.name:'CPU';
          showFlash(`${wn} WIN!`,130);
          beep(gameMode==='net'&&netPlayerNum===1?330:523,'sine',0.6,gameMode==='net'&&netPlayerNum===1?0.35:0.4);
        } else{showFlash('DRAW!',130);}
        // Net: player 1 is authoritative for round transitions
        if (gameMode==='net'&&netPlayerNum===1&&netWs&&netWs.readyState===1) {
          netWs.send(JSON.stringify({type:'roundend',wins,p1wins}));
          phase='roundend'; endTimer=200;
        } else if (gameMode==='net'&&netPlayerNum===2) {
          phase='roundend'; endTimer=999999; // wait for nextround message from player 1
        } else {
          phase='roundend'; endTimer=200;
        }
      }
    }
  }

  if (phase==='roundend'||phase==='countdown') {
    if (phase==='roundend'&&--endTimer<=0) {
      // Net player 2 waits for nextround/gameover message from player 1
      if (gameMode==='net'&&netPlayerNum===2) { endTimer=0; }
      else {
        if (wins[0]>=2||wins[1]>=2){
          if (gameMode==='net'&&netPlayerNum===1&&netWs&&netWs.readyState===1)
            netWs.send(JSON.stringify({type:'gameover'}));
          exitToMenu();return;
        }
        roundNum++;startRound();phase='countdown';
        showFlash(`ROUND ${roundNum}`,80);
        setTimeout(()=>showFlash('FIGHT!',70),1200);
        setTimeout(()=>{phase='fight';},1800);
        if (gameMode==='net'&&netPlayerNum===1&&netWs&&netWs.readyState===1)
          netWs.send(JSON.stringify({type:'nextround',roundNum}));
      }
    }
  }

  drawHurdles();
  GFX.drawGhosts();
  p1.draw(); p2.draw();
  if (activeGorilla) activeGorilla.draw();
  if (activeDragon) activeDragon.draw();

  }

// ---- Mobile 2P Canvas Controls ----
// Touch tracking for 2P mobile: touches left of 400 → P1, right → P2
const touch2PState = {p1:{},p2:{}};

function initMobile2PTouch() {
  function getCanvasCoords(touch) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (touch.clientX - rect.left) * (W / rect.width),
      y: (touch.clientY - rect.top)  * (CANVAS_H / rect.height)
    };
  }

  // Button definitions for 2P mobile layout — delegate to shared function
  function getButtons() { return getMobile2PButtons(); }

  function hitTest(btn, cx, cy) {
    const dx = cx - btn.cx, dy = cy - btn.cy;
    return dx*dx + dy*dy <= btn.r * btn.r;
  }

  function handleTouch(e) {
    if (gameMode !== '2p') return; // 1P mode: HTML buttons handle input
    e.preventDefault();
    const buttons = getButtons();
    // Reset all button keys
    buttons.forEach(b => { keys[b.key] = false; if (b.key2) keys[b.key2] = false; });
    // Set keys for active touches
    for (let i = 0; i < e.touches.length; i++) {
      const coords = getCanvasCoords(e.touches[i]);
      buttons.forEach(b => {
        if (hitTest(b, coords.x, coords.y)) {
          keys[b.key] = true;
          if (b.key2) keys[b.key2] = true;
        }
      });
    }
  }

  canvas.addEventListener('touchstart',  handleTouch, {passive:false});
  canvas.addEventListener('touchmove',   handleTouch, {passive:false});
  canvas.addEventListener('touchend',    handleTouch, {passive:false});
  canvas.addEventListener('touchcancel', handleTouch, {passive:false});
}

function drawMobile2PControls() {
  const buttons = getMobile2PButtons();
  const top = CANVAS_H === 600 ? 455 : 315;

  // コントロールエリア背景
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0, top, W, CANVAS_H - top);

  // 中央分割線
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(W/2, top); ctx.lineTo(W/2, CANVAS_H); ctx.stroke();
  ctx.setLineDash([]);

  // P1/P2 ラベル
  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,200,255,0.85)'; ctx.fillText('P1', 40, top+14);
  ctx.fillStyle = 'rgba(255,150,0,0.85)'; ctx.fillText('P2', W-40, top+14);

  buttons.forEach(btn => {
    const active = !!keys[btn.key];
    const isP1 = btn.player === 1;
    const baseColor = isP1 ? 'rgba(0,200,255,' : 'rgba(255,150,0,';
    ctx.beginPath(); ctx.arc(btn.cx, btn.cy, btn.r, 0, Math.PI*2);
    ctx.fillStyle = active ? baseColor+'0.6)' : baseColor+'0.18)';
    ctx.fill();
    ctx.strokeStyle = active ? baseColor+'0.95)' : baseColor+'0.45)';
    ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(btn.label, btn.cx, btn.cy + 5);
  });
}

  t('しゃがみガード: パンチはブロックしない', () => {
    const f = mkF('icchi', true, 300); f.state='crouch'; f.guardMode=true;
    f.takeHit({dmg:10, stun:16, push:0, type:'punch'}, -1);
    if (f.hp === 100) throw new Error('crouch guard must not block punches');
  });
  t('しゃがみ(ガードなし): キックはヒットする', () => {
    const f = mkF('icchi', true, 300); f.state='crouch'; f.guardMode=false;
    f.takeHit({dmg:10, stun:16, push:0, type:'kick'}, -1);
    if (f.hp === 100) throw new Error('unguarded crouch should receive kick damage');
  });

  // ---- hitbox方向確認 ----
  t('jatk(ジャンプパンチ)のhitboxはy座標が上(低い値)', () => {
    const f = mkF('icchi', true, 300);
    f.state = 'jatk'; f.st = CHARS.icchi.jatkS;
    const hb = f.hitbox();
    if (!hb) throw new Error('jatk hitbox expected');
    // hb.y は絶対座標 (GROUND=340基準)、jatkはGROUND-120*scale付近
    const relY = hb.y - GROUND; // 相対値: 約 -84 (scale=0.70)
    if (relY > -80) throw new Error('jatk hitbox should be above head, got relY=' + relY);
  });
  t('jkick(ジャンプキック)のhitboxはy座標が下(高い値)', () => {
    const f = mkF('icchi', true, 300);
    f.state = 'jkick'; f.st = CHARS.icchi.kickS;
    const hb = f.hitbox();
    if (!hb) throw new Error('jkick hitbox expected');
    // hb.y は絶対座標 (GROUND=340基準)、jkickはGROUND-70*scale付近
    const relY = hb.y - GROUND; // 相対値: 約 -49 (scale=0.70)
    if (relY < -80) throw new Error('jkick hitbox should be near feet, got relY=' + relY);
  });

  // ---- アニメーション段階テスト ----
  t('パンチ前半フレームでhitboxが有効', () => {
    const f = mkF('icchi', true, 300);
    f.state = 'punch'; f.st = CHARS.icchi.punchS;
    if (!f.hitbox()) throw new Error('punch hitbox should be active at punchS');
  });
  t('パンチ後半フレームでhitboxが有効', () => {
    const f = mkF('icchi', true, 300);
    f.state = 'punch'; f.st = CHARS.icchi.punchE;
    if (!f.hitbox()) throw new Error('punch hitbox should be active at punchE');
  });
  t('キック前半フレームでhitboxが有効', () => {
    const f = mkF('icchi', true, 300);
    f.state = 'kick'; f.st = CHARS.icchi.kickS;
    if (!f.hitbox()) throw new Error('kick hitbox should be active at kickS');
  });
  t('ジャンプ中はonGround=false', () => {
    const f = mkF('icchi', true, 300);
    f.vy = -10; f.onGround = false; f.state = 'jump';
    eq(f.onGround, false);
  });
  t('ブロック状態でguardMode=true（update経由）', () => {
    const f = mkF('icchi', true, 300);
    f.state = 'block';
    const opp = mkF('yuuri', false, 500);
    f.update(opp, mkI());
    eq(f.guardMode, true);
  });

  // ---- 新機能テスト (feat/mechanics) ----

  t('soyo: jumpVel が -19 に変更されている', () => eq(CHARS.soyo.jumpVel, -19));

  t('しゃがみガード: jkick はヒットする(ガード不能)', () => {
    const f = mkF('icchi', true, 300); f.state='crouch'; f.guardMode=true;
    f.takeHit({dmg:10, stun:16, push:0, type:'jkick'}, -1);
    if (f.hp === 100) throw new Error('crouch guard must not block jkick');
  });

  t('7連続ヒットでダウン状態(state=down)になる', () => {
    const f = mkF('icchi', true, 300);
    for (let i = 0; i < 6; i++) { f.hitStun = 0; f.takeHit({dmg:1, stun:1, push:0, type:'punch'}, -1); }
    f.hitStun = 0; f.takeHit({dmg:1, stun:1, push:0, type:'punch'}, -1);
    eq(f.state, 'down');
  });

  t('down状態が終わるとdownriseに遷移する', () => {
    const f = mkF('icchi', true, 300); f.state = 'down'; f.st = 0;
    const opp = mkF('yuuri', false, 500);
    for (let i = 0; i < 90; i++) f.update(opp, mkI());
    eq(f.state, 'downrise');
  });

  t('downrise状態が終わるとidleに遷移する', () => {
    const f = mkF('icchi', true, 300); f.state = 'downrise'; f.st = 0;
    const opp = mkF('yuuri', false, 500);
    for (let i = 0; i < 30; i++) f.update(opp, mkI());
    eq(f.state, 'idle');
  });

  t('downrise終了後にinvincFrames=60が付与される', () => {
    const f = mkF('icchi', true, 300); f.state = 'downrise'; f.st = 0;
    const opp = mkF('yuuri', false, 500);
    for (let i = 0; i < 30; i++) f.update(opp, mkI());
    if (f.invincFrames < 60) throw new Error('invincFrames should be 60 after downrise, got ' + f.invincFrames);
  });

  t('invincFrames中はtakeHitがfalseを返す', () => {
    const f = mkF('icchi', true, 300); f.invincFrames = 30;
    const result = f.takeHit({dmg:10, stun:16, push:0, type:'punch'}, -1);
    eq(result, false); eq(f.hp, 100);
  });

  t('コーナー付近のディフェンダー → 攻撃者が後退する', () => {
    const defender = mkF('icchi', true, 50);
    const attacker = mkF('yuuri', false, 150);
    fighters[0] = defender; fighters[1] = attacker;
    const attackerXBefore = attacker.x;
    defender.takeHit({dmg:5, stun:1, push:20, type:'punch'}, 1);
    if (Math.abs(attacker.x - attackerXBefore) < 1) throw new Error('attacker should be pushed back in corner');
    eq(defender.x, 50);
  });

  t('otousan必殺技: 3回specialFiredが発生する(st=15,30,45)', () => {
    const f = mkF('otousan', true, 300); const opp = mkF('icchi', false, 500);
    f.state = 'special'; f.st = 0; f.specialFired = false;
    let fireCount = 0;
    for (let frame = 0; frame < 62; frame++) {
      f.update(opp, mkI());
      if (f.specialFired) { fireCount++; f.specialFired = false; }
      if (f.state !== 'special') break;
    }
    eq(fireCount, 3);
  });

  t('okaasanゴリラ攻撃: 立ちガードで削りダメージ(type=special)', () => {
    const f = mkF('icchi', true, 300); f.state='block'; f.guardMode=true;
    const result = f.takeHit({dmg:12, stun:20, push:18, type:'special'}, -1);
    eq(result, true); eq(f.hp, 100 - Math.floor(12*0.4)); // 40%削り
  });

  t('jatk突入時にvyがリセットされない(空中パンチ)', () => {
    const f = mkF('icchi', true, 300);
    f.onGround = false; f.y = GROUND - 80; f.vy = -10;
    f.state = 'jatk'; f.st = 0; f.atkHit = false;
    if (f.vy === 0) throw new Error('vy should not be 0 when entering jatk, got ' + f.vy);
  });

  t('jatk中は毎フレームvy+=gravity(重力が継続する)', () => {
    const f = mkF('icchi', true, 300); const opp = mkF('yuuri', false, 500);
    f.onGround = false; f.y = GROUND - 80; f.vy = -10;
    f.state = 'jatk'; f.st = 0; f.atkHit = false;
    const vyBefore = f.vy; f.update(opp, mkI());
    near(f.vy, vyBefore + f.def.gravity, 'vy after one jatk frame');
  });

  t('jkick突入時にvyがリセットされない(空中キック)', () => {
    const f = mkF('icchi', true, 300);
    f.onGround = false; f.y = GROUND - 80; f.vy = -8;
    f.state = 'jkick'; f.st = 0; f.atkHit = false;
    if (f.vy === 0) throw new Error('vy should not be 0 when entering jkick, got ' + f.vy);
  });

  t('jatk着地時にidleへ遷移する', () => {
    const f = mkF('icchi', true, 300); const opp = mkF('yuuri', false, 500);
    f.onGround = false; f.y = GROUND - 2; f.vy = 5;
    f.state = 'jatk'; f.st = 2; f.atkHit = false;
    f.update(opp, mkI()); eq(f.state, 'idle'); eq(f.onGround, true);
  });

  t('jkick着地時にidleへ遷移する', () => {
    const f = mkF('icchi', true, 300); const opp = mkF('yuuri', false, 500);
    f.onGround = false; f.y = GROUND - 2; f.vy = 5;
    f.state = 'jkick'; f.st = 2; f.atkHit = false;
    f.update(opp, mkI()); eq(f.state, 'idle'); eq(f.onGround, true);
  });

  // ---- 新機能テスト (feat/controls) ----

  t('cpuDifficulty: 変数が存在しデフォルトは normal', () => eq(cpuDifficulty, 'normal'));

  t('CPU 弱い: 必殺技を使わない', () => {
    const saved = cpuDifficulty; cpuDifficulty = 'weak';
    try {
      const me = mkF('icchi', false, 600); me.specialGauge = 100; me.state = 'idle'; me.onGround = true;
      const opp = mkF('yuuri', true, 500); const cpu = new CPU(me, opp);
      for (let i = 0; i < 200; i++) {
        me.specialGauge = 100; me.state = 'idle'; me.onGround = true;
        const inp = cpu.update();
        if (inp.special) throw new Error('weak CPU must never use special');
      }
    } finally { cpuDifficulty = saved; }
  });

  t('CPU 弱い: キックを使わない', () => {
    const saved = cpuDifficulty; cpuDifficulty = 'weak';
    try {
      const me = mkF('icchi', false, 90); const opp = mkF('yuuri', true, 90);
      const cpu = new CPU(me, opp);
      for (let i = 0; i < 500; i++) {
        me.state = 'idle'; me.onGround = true; me.hitStun = 0; me.blockStun = 0;
        const inp = cpu.update();
        if (inp.kick) throw new Error('weak CPU must never use kick');
      }
    } finally { cpuDifficulty = saved; }
  });

  t('drawP2KeyHint: P2キー表示テキストが定義されている', () => {
    if (typeof drawP2KeyHint !== 'function') throw new Error('drawP2KeyHint function not found');
  });

  t('getMobile2PButtons: P1とP2のボタンが存在する', () => {
    const btns = getMobile2PButtons();
    const p1btns = btns.filter(b => b.player === 1);
    const p2btns = btns.filter(b => b.player === 2);
    if (p1btns.length === 0) throw new Error('P1 buttons missing');
    if (p2btns.length === 0) throw new Error('P2 buttons missing');
  });

  t('getMobile2PButtons: P1ボタンはx<400に配置', () => {
    const btns = getMobile2PButtons();
    btns.filter(b => b.player === 1).forEach(b => { if (b.cx >= 400) throw new Error(`P1 button cx=${b.cx} must be < 400`); });
  });

  t('getMobile2PButtons: P2ボタンはx>=400に配置', () => {
    const btns = getMobile2PButtons();
    btns.filter(b => b.player === 2).forEach(b => { if (b.cx < 400) throw new Error(`P2 button cx=${b.cx} must be >= 400`); });
  });

  t('EXIT_BTN: 定数が存在する', () => {
    if (typeof EXIT_BTN === 'undefined') throw new Error('EXIT_BTN not defined');
    if (typeof EXIT_BTN.x !== 'number') throw new Error('EXIT_BTN.x missing');
    if (EXIT_BTN.w <= 0) throw new Error('EXIT_BTN.w must be positive');
  });

  t('drawExitButton: 関数が存在する', () => {
    if (typeof drawExitButton !== 'function') throw new Error('drawExitButton function not found');
  });

  t('exitToMenu: 実行するとphaseがmodeselectになる', () => {
    phase = 'fight'; exitToMenu();
    if (phase !== 'modeselect') throw new Error(`phase=${phase}, expected modeselect`);
  });

  // ---- 実行 ----
  _T.forEach(({name,fn}) => {
    try { fn(); _R.push({name,pass:true}); }
    catch(e) { _R.push({name,pass:false,err:e.message}); }
  });

  const passed=_R.filter(r=>r.pass).length, total=_R.length, failed=total-passed;
  const div=document.createElement('div');
  div.style.cssText='position:fixed;inset:0;overflow-y:auto;background:#0d1117;color:#e6edf3;font:13px "Consolas","Monaco",monospace;padding:20px 24px;z-index:9999;';
  let h=`<div style="margin-bottom:16px">`;
  h+=`<div style="font-size:20px;font-weight:bold;color:#fff;margin-bottom:6px">大乱闘 ウエダファミリー — Unit Tests</div>`;
  h+=`<div style="font-size:14px;color:${failed===0?'#3fb950':'#f85149'}">`;
  h+=`${passed} / ${total} passed`;
  if(failed>0) h+=` &nbsp;— &nbsp;<strong>${failed} FAILED</strong>`; else h+=' &nbsp;✓ All passed';
  h+=`</div></div>`;
  h+=`<table style="border-collapse:collapse;width:100%;font-size:12px">`;
  _R.forEach(({name,pass,err})=>{
    h+=`<tr style="${pass?'':'background:#2d1515;'}border-bottom:1px solid #21262d">`;
    h+=`<td style="padding:3px 8px;color:${pass?'#3fb950':'#f85149'};width:20px">${pass?'✓':'✗'}</td>`;
    h+=`<td style="padding:3px 8px">${name}</td>`;
    h+=`<td style="padding:3px 8px;color:#f85149">${pass?'':err}</td>`;
    h+=`</tr>`;
  });
  h+=`</table>`;
  div.innerHTML=h;
  document.body.appendChild(div);

} else {
  requestAnimationFrame(ts => { _lastLoopTs = ts; requestAnimationFrame(loop); });
}
</script>
</body>
</html>
